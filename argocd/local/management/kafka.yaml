apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/kafka
    helm:
      # The release name appears in the Deployment selectors, which are immutable.
      releaseName: kafka
  destination:
    name: in-cluster
    namespace: kafka-system
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
