apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-mimir
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/lgtm-mimir
    helm:
      # Keeps the old release name so the StatefulSets and their volumes are not renamed.
      releaseName: mimir
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
