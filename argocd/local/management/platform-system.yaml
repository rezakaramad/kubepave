apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-system-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/platform-system
    helm:
      # Keeps the release name from install-charts.sh.
      releaseName: platform-system
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    name: in-cluster
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
