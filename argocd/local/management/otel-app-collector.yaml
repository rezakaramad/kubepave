apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-app-collector-management
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/otel-app-collector
    helm:
      valueFiles:
        - values.yaml
        - values-local-management.yaml
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
