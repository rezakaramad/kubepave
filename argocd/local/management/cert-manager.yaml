apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/cert-manager
    helm:
      releaseName: cert-manager
      valueFiles:
        - values.yaml
        - values-local.yaml
        - values-local-management.yaml
  destination:
    name: in-cluster
    namespace: platform-system
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
