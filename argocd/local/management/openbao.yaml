apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/openbao
  destination:
    name: in-cluster
    namespace: openbao
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
