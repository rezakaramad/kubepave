apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics-development
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/kube-state-metrics
    helm:
      valueFiles:
        - values.yaml
  destination:
    name: kind-development
    namespace: observability
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
