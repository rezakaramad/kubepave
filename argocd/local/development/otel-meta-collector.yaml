apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-meta-collector-development
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/otel-meta-collector
    helm:
      valueFiles:
        - values.yaml
        - values-local-development.yaml
  destination:
    name: kind-development
    namespace: observability
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
