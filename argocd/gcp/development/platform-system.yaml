apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-system-dev
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: kubernetes/charts/gcp/platform-system
  destination:
    name: gke-development
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
