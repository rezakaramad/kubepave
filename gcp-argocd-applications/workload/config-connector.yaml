apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-connector-wl
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/gcp/config-connector
  destination:
    name: gke-workload
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
