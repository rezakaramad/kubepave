apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-workload
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/cilium
    helm:
      valueFiles:
        - values.yaml
        - values-local-workload.yaml
  destination:
    name: kind-workload
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
