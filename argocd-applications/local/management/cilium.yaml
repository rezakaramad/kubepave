apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-management
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/cilium
    helm:
      valueFiles:
        - values.yaml
        - values-local-management.yaml
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    # Cilium generates its own CA keypair at runtime (Hubble mTLS / WireGuard).
    # Argo CD must not try to overwrite or flag it as OutOfSync.
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
