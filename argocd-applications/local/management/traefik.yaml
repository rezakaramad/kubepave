apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-management
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/traefik
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
        - values-local-management.yaml
  destination:
    name: in-cluster
    namespace: platform-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
