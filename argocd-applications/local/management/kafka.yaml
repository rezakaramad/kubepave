apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-management
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/kafka
    helm:
      # Strimzi's CRDs are managed out-of-band (pre-applied bundle in install-charts.sh).
      # Skipping them here avoids rendering them twice (parent crds/ + subchart crds/).
      skipCrds: true
  destination:
    name: in-cluster
    namespace: kafka-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
