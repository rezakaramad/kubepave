apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics-management
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/kube-state-metrics
    helm:
      valueFiles:
        - values.yaml
  destination:
    name: in-cluster
    namespace: observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
