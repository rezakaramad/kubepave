apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo-development
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/otel-demo
    helm:
      valueFiles:
        - values.yaml
  destination:
    name: kind-development
    namespace: otel-demo
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
