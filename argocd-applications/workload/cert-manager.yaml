apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-workload
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/cert-manager
    helm:
      valueFiles:
        - values.yaml
        - values-local-workload.yaml
  destination:
    name: kind-workload
    namespace: platform-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
