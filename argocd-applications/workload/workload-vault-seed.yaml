apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-clusters-vault-seed
  namespace: argocd
spec:
  project: platform-system
  source:
    repoURL: https://github.com/rezakaramad/kubepave
    targetRevision: HEAD
    path: charts/workload-vault-seed
  destination:
    name: kind-workload
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
