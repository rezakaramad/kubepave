kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  podSubnet: "192.168.102.0/24"
  serviceSubnet: "192.168.103.0/24"
  # Disable the default kindnet CNI — Cilium is installed as the CNI + LB instead.
  disableDefaultCNI: true
  # Disable kube-proxy — Cilium runs in kube-proxy-replacement mode, which is
  # required for its L2 LoadBalancer announcements to program the service datapath.
  kubeProxyMode: "none"

nodes:
  - role: control-plane
    # kubeadm reuses a CA found in /etc/kubernetes/pki. Paths are relative to local/kind.
    extraMounts:
      - hostPath: ./kind-configs/.crt/ca.crt
        containerPath: /etc/kubernetes/pki/ca.crt
        readOnly: true
      - hostPath: ./kind-configs/.crt/ca.key
        containerPath: /etc/kubernetes/pki/ca.key
        readOnly: true
    extraPortMappings: []
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      # The issuer is the API server's own name, so OIDC discovery works from the management cluster and the
      # issuer differs from management's. Keep the name in sync with DEVELOPMENT_API_HOST in libs/common.sh.
      # certSANs puts it in the API server cert; setup-clusters.sh makes CoreDNS resolve it to the node IP.
      # api-audiences keeps the default audience, which it would otherwise derive from the issuer.
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - localhost
            - 127.0.0.1
            - api.dev.k8s.rezakara.demo
          extraArgs:
            service-account-issuer: "https://api.dev.k8s.rezakara.demo:6443"
            service-account-jwks-uri: "https://api.dev.k8s.rezakara.demo:6443/openid/v1/jwks"
            api-audiences: "https://kubernetes.default.svc.cluster.local"
