kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  podSubnet: "192.168.100.0/24"
  serviceSubnet: "192.168.101.0/24"
  # Disable the default kindnet CNI — Cilium is installed as the CNI + LB instead.
  disableDefaultCNI: true
  # Disable kube-proxy — Cilium runs in kube-proxy-replacement mode, which is
  # required for its L2 LoadBalancer announcements to program the service datapath.
  kubeProxyMode: "none"

nodes:
  - role: control-plane
    # kubeadm reuses a CA found in /etc/kubernetes/pki. Paths are relative to local/kind.
    extraMounts:
      - hostPath: ./kind-configs/.crt/ca.crt
        containerPath: /etc/kubernetes/pki/ca.crt
        readOnly: true
      - hostPath: ./kind-configs/.crt/ca.key
        containerPath: /etc/kubernetes/pki/ca.key
        readOnly: true
    # Promiscuous mode on the node interface is enabled post-create for Cilium L2 ARP.
    extraPortMappings: []
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      # The issuer is the API server's own name (see development.yaml). Keep it in sync with MANAGEMENT_API_HOST
      # in libs/common.sh. api-audiences keeps the kubeadm default, which many roles and tokens pin.
      # certSANs replaces kind's default list, so localhost and 127.0.0.1 (the host's kubectl) must be repeated.
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - localhost
            - 127.0.0.1
            - api.mgmt.k8s.rezakara.demo
          extraArgs:
            service-account-issuer: "https://api.mgmt.k8s.rezakara.demo:6443"
            service-account-jwks-uri: "https://api.mgmt.k8s.rezakara.demo:6443/openid/v1/jwks"
            api-audiences: "https://kubernetes.default.svc.cluster.local"
