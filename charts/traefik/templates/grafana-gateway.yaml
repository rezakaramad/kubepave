{{- if .Values.grafanaGateway.enabled }}
{{- $certificateName := printf "%s-cert-traefik" (include "certificateName" .Values.grafanaGateway.hostname) -}}

#
# Gateway for the per-tenant Grafana instances only, with its own wildcard certificate
###########################################################################################

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-traefik
  namespace: platform-system
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer | quote }}
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      hostname: {{ .Values.grafanaGateway.hostname | quote }}
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: {{ $certificateName | quote }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.grafanaGateway.namespace | quote }}
{{- end }}
