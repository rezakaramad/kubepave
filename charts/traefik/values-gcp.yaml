defaulGateway:
  # The hostname for defeault gateway resource in management cluster
  hostname: ''
  # In workload clusters, we don't allow tenants to send traffic
  # to platform-owned default Gateway in 'platform-system' namespace.
  allowedRoutes: {}

# TLS — always enabled; cert-manager issues the certificate via the cluster-issuer annotation.
tls:
  clusterIssuer: gcp-talktorubberduck-dev
