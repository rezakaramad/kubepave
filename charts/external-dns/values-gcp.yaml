# The Google project ID where DNS resources are managed in Cloud DNS.
dnsGoogleProjectID: kara-dns

# The GCP project ID where the GKE cluster runs.
# Used to construct the Workload Identity pool name (<project>.svc.id.goog) in the
# IAMPartialPolicy that allows the 'cert-manager' Kubernetes SA to impersonate the GCP SA.
managementGoogleProjectID: kara-mgmt

# The Kubernetes namespace where cert-manager is installed.
# Used to construct the Workload Identity member: <project>.svc.id.goog[<namespace>/cert-manager]
workloadIdentityNamespace: platform-system

# Only one Google service account (GSA) should be create for external-dns.
# Using development identity all external-secrets instances use the same GSA.
createIamServiceAccount: false

external-dns:
  txtPrefix: "externaldns"

  # Limit possible target zones by domain suffixes.
  domainFilters: []

  # DNS Provider
  provider: google

  # Create a service account for ExternalDNS with WIF annotation.
  serviceAccount:
      create: true
      annotations:
        iam.gke.io/gcp-service-account: "external-dns@kara-mgmt.iam.gserviceaccount.com"

  # These are CLI flags passed directly to the ExternalDNS container (external-dns binary)
  extraArgs:
    # Tells ExternalDNS which GCP project to look for Cloud DNS zones in.
    - --google-project=kara-dns

    # Cloud DNS zones can be public (internet-facing) or private (VPC-internal only).
    # This restricts ExternalDNS to only manage public zones, so it won't accidentally touch any private zones in 'kara-dns'.
    - --google-zone-visibility=public

    # ExternalDNS by default will try to create DNS records for every HTTPRoute and DNSEndpoint it sees.
    # This filter means it only acts on resources that have the label 'external-dns-create: "true"'.
    # This gives you opt-in control — a route won't get a public DNS record unless you explicitly label it.
    - --label-filter=external-dns-create in (true)

    # Scopes ExternalDNS's watch to only Gateway resources in the 'platform-system' namespace
    - --gateway-namespace=platform-system
