otelCollector:
  # On the management cluster the backends are reached through their in-cluster services.
  alternateConfig:
    processors:
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: management
            action: upsert
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.observability.svc:4318
      otlphttp/loki:
        endpoint: http://loki.observability.svc:3100/otlp
      otlphttp/gateway:
        endpoint: http://gateway-collector.observability.svc:4318
