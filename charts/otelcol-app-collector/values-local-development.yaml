# Creates the gateway-collector-auth Secret that holds the token for the gateway.
gatewayAuth:
  enabled: true

otelCollector:
  # The management routes are only resolvable reliably without the search list (see README).
  dnsConfig:
    options:
      - name: ndots
        value: "1"

  extraEnvs:
    - name: GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: gateway-collector-auth
          key: token

  # Only the public certificate is mounted, never the private key in the same secret.
  extraVolumes:
    - name: root-ca
      secret:
        secretName: root-ca
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: root-ca
      mountPath: /etc/root-ca
      readOnly: true

  alternateConfig:
    extensions:
      bearertokenauth/gateway:
        token: ${env:GATEWAY_TOKEN}
    processors:
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: development
            action: upsert
    exporters:
      otlphttp/tempo:
        endpoint: https://tempo.mgmt.rezakara.demo
        tls:
          ca_file: /etc/root-ca/ca.crt
      otlphttp/loki:
        endpoint: https://loki.mgmt.rezakara.demo/otlp
        tls:
          ca_file: /etc/root-ca/ca.crt
      # Metrics go through the tenant-aware gateway instead of straight to Mimir.
      otlphttp/gateway:
        endpoint: https://gateway-collector.mgmt.rezakara.demo
        auth:
          authenticator: bearertokenauth/gateway
        tls:
          ca_file: /etc/root-ca/ca.crt
    service:
      extensions:
        - health_check
        - bearertokenauth/gateway
      pipelines:
        metrics:
          exporters: [otlphttp/gateway]
