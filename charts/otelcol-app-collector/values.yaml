otelCollector:
  mode: deployment
  # The tenant NetworkPolicy allows ingress from pods labelled app.kubernetes.io/name=app-collector.
  nameOverride: app-collector
  fullnameOverride: app-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  # Adds k8s.* attributes (pod, namespace, deployment) to everything that passes through.
  presets:
    kubernetesAttributes:
      enabled: true

  ports:
    otlp:
      enabled: true
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Used instead of `config` because Helm can't remove the chart's default jaeger/zipkin receivers.
  # Preset components (k8s_attributes) are still injected into this config.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s

    service:
      extensions:
        - health_check
      # Internal metrics go to meta-collector, so this collector never monitors itself through itself.
      telemetry:
        resource:
          service.name: app-collector
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://meta-collector.observability.svc:4318/v1/metrics
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/mimir]
