# Kafka cluster provisioned by the bundled Strimzi operator (KRaft mode, no ZooKeeper).
# Operator settings live under the `strimzi-kafka-operator` key (the dependency subchart).
cluster:
  # Set to false to install the operator only, without a Kafka cluster.
  enabled: true
  name: kafka
  version: 4.3.1

  # A controller runs the KRaft metadata quorum that tracks cluster state.
  controller:
    replicas: 3
    storage:
      size: 10Gi
      deleteClaim: false

  # A broker stores topic partitions on disk and serves produce/consume traffic to clients.
  broker:
    replicas: 3
    storage:
      size: 10Gi
      deleteClaim: false

  # A listener is a network endpoint (port + protocol) that clients use to connect to brokers.
  # OAuth authentication: clients present a JWT and the broker validates it against the
  # Kubernetes API's OIDC/JWKS endpoint — i.e. a pod's ServiceAccount token is the credential.
  listeners:
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        # Strimzi 1.2.0 (API v1) removed the built-in `oauth` type. OAuth/OIDC is now wired
        # via `custom` authentication using Strimzi's bundled OAuth library.
        type: custom
        # Enable SASL on this (TLS) listener -> SASL_SSL.
        sasl: true
        listenerConfig:
          # Clients authenticate with an OAuth bearer token (a JWT).
          sasl.enabled.mechanisms: OAUTHBEARER
          # Server-side validator from Strimzi's OAuth library.
          oauthbearer.sasl.server.callback.handler.class: io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
          # Validate the JWT: pin the issuer, fetch signing keys from the K8s JWKS endpoint,
          # take the principal from `sub`, and require the token audience to contain "kafka".
          # TLS trust for the JWKS endpoint uses the broker's own mounted cluster CA, so no
          # extra CA secret is needed. In GKE the JWKS is public HTTPS — drop the two
          # oauth.ssl.truststore.* lines there.
          oauthbearer.sasl.jaas.config: >-
            org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
            oauth.valid.issuer.uri="https://kubernetes.default.svc.cluster.local"
            oauth.jwks.endpoint.uri="https://kubernetes.default.svc/openid/v1/jwks"
            oauth.username.claim="sub"
            oauth.check.audience="true"
            oauth.client.id="kafka"
            oauth.ssl.truststore.location="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            oauth.ssl.truststore.type="PEM" ;

  # Topics created declaratively via the Topic Operator.
  topics:
    - name: demo-topic
      # split the topic into multiple partitions for parallelism
      partitions: 3
      # keep multiple copies of the topic across brokers for fault tolerance
      replicas: 3

  config:
    # How many copies of the internal consumer-offsets topic are kept across brokers.
    offsets.topic.replication.factor: 3
    # How many copies of the internal transaction-state topic are kept across brokers.
    transaction.state.log.replication.factor: 3
    # Minimum in-sync copies required to write to the transaction-state topic.
    transaction.state.log.min.isr: 2
    # Default number of copies for new topics when the client doesn't specify one.
    default.replication.factor: 3
    # Minimum in-sync copies a producer needs before a write is acknowledged.
    min.insync.replicas: 2
