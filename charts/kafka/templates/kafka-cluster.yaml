{{- if .Values.cluster.enabled }}

apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: {{ .Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  replicas: {{ .Values.cluster.controller.replicas }}
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.cluster.controller.storage.size }}
        deleteClaim: {{ .Values.cluster.controller.storage.deleteClaim }}
        kraftMetadata: shared

---

apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: {{ .Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  replicas: {{ .Values.cluster.broker.replicas }}
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.cluster.broker.storage.size }}
        deleteClaim: {{ .Values.cluster.broker.storage.deleteClaim }}
        kraftMetadata: shared

---

apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.cluster.version }}
    # metadataVersion is defaulted by the operator to match `version` when omitted.
    listeners:
      {{- toYaml .Values.cluster.listeners | nindent 6 }}
    config:
      {{- toYaml .Values.cluster.config | nindent 6 }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- range .Values.cluster.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.cluster.name }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
{{- end }}
{{- end }}

---
