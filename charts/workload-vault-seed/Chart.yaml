apiVersion: v2
name: workload-vault-seed
description: >-
  DEPRECATED — no longer used.
  Previously bootstrapped the vault-reviewer SA and token-review RBAC that
  Vault used to validate workload SA tokens via the Kubernetes auth method.
  Vault now uses JWT auth, fetching each cluster's JWKS directly from its API
