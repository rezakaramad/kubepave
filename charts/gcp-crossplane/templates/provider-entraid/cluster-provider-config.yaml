{{- if .Values.entraIdProvider.enabled }}

apiVersion: azuread.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: azuread
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  tenantID: {{ .Values.entraIdProvider.tenantID }}
  clientID: {{ .Values.entraIdProvider.clientID }}
  oidcTokenFilePath: /var/run/secrets/tokens/azure-token
  credentials:
    source: OIDCTokenFile

{{- end }}
