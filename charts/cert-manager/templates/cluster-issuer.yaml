{{- if and (not .Values.selfSignedRootCA.enabled) (.Capabilities.APIVersions.Has "cert-manager.io/v1/ClusterIssuer") }}

# A ClusterIssuer with a Let's Encrypt ACME issuer in GCP setup.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: gcp-talktorubberduck-dev
  annotations:
    # ClusterIssuer requires cert-manager CRDs to exist first.
    # As a Helm hook it runs after the main install/upgrade completes (i.e. after CRDs are registered).
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  acme:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: gcp-talktorubberduck-dev-issuer-account-key
    solvers:
    - dns01:
        cloudDNS:
          project: {{ .Values.dnsGoogleProjectID }}

---
{{- else }}

# A ClusterIssuer with a self-signed root CA in local setup.

{{/*
Step 3/3 — both management and workload (selfSignedRootCA.enabled: true)

Creates a ClusterIssuer from the 'root-ca' Secret, allowing cert-manager to sign
certificates for services in any namespace (for example, Traefik's wildcard TLS certificate).
At this point, the 'root-ca' Secret already exists:
- On management clusters: created locally in step 2.
- On workload clusters: copied from the management cluster by setup-trust.sh.
*/}}

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ca:
    secretName: root-ca

---
{{- end }}
