{{/*
Step 3/3 — both management and workload (rootCA.enabled: true)

Creates a ClusterIssuer from the 'root-ca' Secret, allowing cert-manager to sign
certificates for services in any namespace (for example, Traefik's wildcard TLS certificate).
At this point, the 'root-ca' Secret already exists:
- On management clusters: created locally in step 2.
- On workload clusters: copied from the management cluster by setup-trust.sh.
*/}}

{{- if and .Values.rootCA.enabled (.Capabilities.APIVersions.Has "cert-manager.io/v1/ClusterIssuer") }}

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-ca
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ca:
    secretName: root-ca

{{- end }}
