{{/*
Step 2/3 — management only (selfSignedRootCA.mint: true)

Asks the 'selfsigned' ClusterIssuer (step 1) to produce a self-signed CA certificate
and store it in the Secret named 'root-ca' in 'platform-system'. That Secret contains
'ca.crt' / 'tls.crt' / 'tls.key'. 'setup-trust.sh' then copies this Secret directly
to workload clusters.
*/}}

{{- if and .Values.selfSignedRootCA.enabled .Values.selfSignedRootCA.mint (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  isCA: true
  commonName: root-ca
  secretName: root-ca
  issuerRef:
    name: self-signed
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always

{{- end }}
