otelCollector:
  alternateConfig:
    processors:
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: management
            action: upsert
    exporters:
      otlphttp/loki:
        endpoint: http://loki.observability.svc:3100/otlp
      otlphttp/mimir:
        endpoint: http://mimir-gateway.observability.svc/otlp
