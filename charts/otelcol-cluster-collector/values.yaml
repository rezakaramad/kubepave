otelCollector:
  # One replica: a second would ship every event and metric twice.
  mode: deployment
  replicaCount: 1
  nameOverride: cluster-collector
  fullnameOverride: cluster-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  presets:
    kubernetesEvents:
      enabled: true
      useK8sEventsReceiver: true
    kubernetesAttributes:
      enabled: true

  # Nothing sends to this collector, so no ports and no Service.
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  extraEnvs:
    - name: GATEWAY_TOKEN
      valueFrom:
        secretKeyRef:
          name: gateway-collector-auth
          key: token

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      bearertokenauth/gateway:
        token: ${env:GATEWAY_TOKEN}

    receivers:
      # Metrics come from the kube-state-metrics chart in the same namespace.
      prometheus/ksm:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 60s
              static_configs:
                - targets:
                    - kube-state-metrics.observability.svc:8080

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s
      # kube-state-metrics sends every pod in one resource; the pod identity moves to resource attributes
      # so k8sattributes can look the pod up. The pod and namespace labels stay on the series.
      transform/pod_identity:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil
              - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil
      groupbyattrs/pod:
        keys:
          - k8s.pod.name
          - k8s.namespace.name
      # Series of pods in a namespace with the tenant label belong to that tenant; the rest is platform.
      k8sattributes:
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name
        extract:
          labels:
            - tag_name: tenant.id
              key: platform.rezakara.demo/tenant
              from: namespace
      resource/tenant:
        attributes:
          - key: tenant.id
            value: platform
            action: insert

    exporters:
      # Telemetry goes through the tenant-aware gateway; the endpoint is set per cluster.
      otlphttp/gateway:
        auth:
          authenticator: bearertokenauth/gateway

    service:
      extensions:
        - health_check
        - bearertokenauth/gateway
      # Internal metrics go to meta-collector, so this collector never monitors itself through itself.
      telemetry:
        resource:
          service.name: cluster-collector
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://meta-collector.observability.svc:4318/v1/metrics
      # The events preset adds the k8s_events receiver to the logs pipeline.
      # Series without a pod (deployments, namespaces) and events stay platform.
      pipelines:
        logs:
          processors: [memory_limiter, resource/cluster, resource/tenant, batch]
          exporters: [otlphttp/gateway]
        metrics:
          receivers: [prometheus/ksm]
          processors: [memory_limiter, transform/pod_identity, groupbyattrs/pod, k8sattributes, resource/cluster, resource/tenant, batch]
          exporters: [otlphttp/gateway]
