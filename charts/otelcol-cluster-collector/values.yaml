otelCollector:
  # One replica: a second would ship every event and metric twice.
  mode: deployment
  replicaCount: 1
  nameOverride: cluster-collector
  fullnameOverride: cluster-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  presets:
    kubernetesEvents:
      enabled: true
      useK8sEventsReceiver: true
    kubernetesAttributes:
      enabled: true

  # Nothing sends to this collector, so no ports and no Service.
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      # Metrics come from the kube-state-metrics chart in the same namespace.
      prometheus/ksm:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 60s
              static_configs:
                - targets:
                    - kube-state-metrics.observability.svc:8080

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s

    service:
      extensions:
        - health_check
      # Internal metrics go to meta-collector, so this collector never monitors itself through itself.
      telemetry:
        resource:
          service.name: cluster-collector
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://meta-collector.observability.svc:4318/v1/metrics
      # The events preset adds the k8s_events receiver to the logs pipeline.
      pipelines:
        logs:
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [prometheus/ksm]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/mimir]
