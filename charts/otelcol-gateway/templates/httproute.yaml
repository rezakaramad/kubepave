# Lets the collectors on the development cluster reach the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-collector
  namespace: observability
  labels:
    external-dns-create: "true"
spec:
  hostnames:
    - gateway-collector.mgmt.rezakara.demo
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-traefik
      namespace: platform-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: gateway-collector
          port: 4318
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
