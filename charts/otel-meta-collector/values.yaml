otelCollector:
  # Receives the internal metrics of every other collector in this cluster.
  mode: deployment
  replicaCount: 1
  nameOverride: meta-collector
  fullnameOverride: meta-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  # Only the other collectors push here, over OTLP/HTTP.
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # The kubelet rotates this token; the gateway only accepts the audience otel-gateway.
  # Lists are replaced, not merged, so values-local-development.yaml repeats this volume.
  extraVolumes:
    - name: gateway-token
      projected:
        sources:
          - serviceAccountToken:
              audience: otel-gateway
              expirationSeconds: 3600
              path: token
  extraVolumeMounts:
    - name: gateway-token
      mountPath: /var/run/secrets/otel-gateway
      readOnly: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      bearertokenauth/gateway:
        filename: /var/run/secrets/otel-gateway/token

    receivers:
      otlp:
        protocols:
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s
      # Everything this collector gathers is platform telemetry; the gateway drops metrics without a tenant.
      resource/tenant:
        attributes:
          - key: tenant.id
            value: platform
            action: upsert

    exporters:
      # Telemetry goes through the tenant-aware gateway; the endpoint is set per cluster.
      otlphttp/gateway:
        auth:
          authenticator: bearertokenauth/gateway

    service:
      extensions:
        - health_check
        - bearertokenauth/gateway
      # Reports its own metrics to its own OTLP receiver, so they reach the gateway through the authenticated
      # exporter below as platform telemetry and it never monitors itself through itself.
      telemetry:
        resource:
          service.name: meta-collector
          tenant.id: platform
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://${env:MY_POD_IP}:4318/v1/metrics
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, resource/tenant, batch]
          exporters: [otlphttp/gateway]
