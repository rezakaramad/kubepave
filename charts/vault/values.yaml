vault:
  server:
    standalone:
      enabled: true

    postStart:
      - /bin/sh
      - -c
      - |
        set -euo pipefail
        export VAULT_ADDR=http://127.0.0.1:8200

        echo "=== Vault bootstrap starting ==="

        INIT_FILE=/vault/data/init.txt

        ########################################
        # 1. Initialize (only once)
        ########################################

        if [ ! -f "$INIT_FILE" ]; then
          echo "Initializing Vault..."

          until vault operator init -key-shares=1 -key-threshold=1 > "$INIT_FILE" 2>/dev/null; do
            sleep 2
          done

          echo "Vault initialized"
        else
          echo "Vault already initialized"
        fi

        ########################################
        # 2. Read keys
        ########################################

        UNSEAL_KEY=$(grep "Unseal Key 1:" "$INIT_FILE" | awk '{print $4}')
        ROOT_TOKEN=$(grep "Initial Root Token:" "$INIT_FILE" | awk '{print $4}')

        ########################################
        # 3. Unseal
        ########################################

        echo "Unsealing Vault..."

        until vault operator unseal "$UNSEAL_KEY" >/dev/null 2>&1; do
          sleep 2
        done

        echo "Vault unsealed"

        ########################################
        # 4. Authenticated configuration
        ########################################

        export VAULT_TOKEN="$ROOT_TOKEN"

        echo "Writing ESO shared policy..."

        vault policy write eso-shared-policy - <<EOF
        path "local/metadata/shared/*" {
          capabilities = ["read", "list"]
        }

        path "local/data/shared/*" {
          capabilities = ["read"]
        }
        EOF

        echo "Writing platform-system policy..."

        vault policy write eso-platform-system-policy - <<EOF
        path "local/metadata/platform/*" {
          capabilities = ["read", "list"]
        }

        path "local/data/platform/*" {
          capabilities = ["read"]
        }
        EOF

        echo "Writing Keycloak ESO policy..."

        vault policy write keycloak-policy - <<'EOF'
        path "local/data/keycloak/*" {
          capabilities = ["read", "create", "update", "patch"]
        }

        path "local/metadata/keycloak/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing Crossplane policy..."

        vault policy write crossplane-policy - <<'EOF'
        path "local/data/crossplane/*" {
          capabilities = ["read"]
        }

        path "local/metadata/crossplane/*" {
          capabilities = ["read", "list"]
        }

        path "local/data/shared/*" {
          capabilities = ["read"]
        }

        path "local/metadata/shared/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing provider-vault policy..."

        # Policy for the crossplane provider-vault controller. It authenticates to
        # Vault via the Kubernetes auth method (its pod ServiceAccount token — no
        # static secret) and needs to manage per-tenant JWT auth roles.
        vault policy write provider-vault-policy - <<'EOF'
        # When a tenant is provisioned, provider-vault calls
        # PUT /v1/auth/jwt-workload-tenants/role/<tenant> to create the JWT auth
        # role that binds the tenant's namespace to tenant-policy.
        # Without this, the provider gets a 403 on every tenant role reconciliation.
        path "auth/jwt-workload-tenants/role/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }

        # provider-vault reads back the policy name when reconciling a role resource
        # to verify the referenced policy exists (drift detection). Read-only is enough;
        # Crossplane never writes policies, only the postStart bootstrap does.
        path "sys/policies/acl/tenant-policy" {
          capabilities = ["read"]
        }
        EOF

        echo "Writing Backstage policy..."

        vault policy write backstage-policy - <<'EOF'
        path "local/data/backstage/*" {
          capabilities = ["read"]
        }

        path "local/metadata/backstage/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing ArgoCD policy..."

        vault policy write eso-argocd-policy - <<EOF
        path "local/metadata/argocd/*" {
          capabilities = ["read", "list"]
        }

        path "local/data/argocd/*" {
          capabilities = ["read"]
        }
        EOF

        ########################################
        # 5. Enable secrets engines
        ########################################

        echo "Ensuring KV engines exist..."

        vault secrets list | grep -q '^local/' || \
          vault secrets enable -path=local kv-v2

        vault secrets list | grep -q '^tenants/' || \
          vault secrets enable -path=tenants kv-v2

        echo "=== Vault bootstrap complete ==="
