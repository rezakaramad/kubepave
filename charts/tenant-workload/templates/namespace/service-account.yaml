# ServiceAccount used by the tenant to authenticate to the management Vault
# (via the jwt-workload-tenants backend). Its projected, audience-bound token is
# the identity the Vault AuthBackendRole (created by the tenant-management chart)
# binds to. The Vault entity alias resolves to this namespace name, so the
# identity-templated tenant-policy scopes access to tenants/data/<tenant>/* only.

{{- if .Values.vault.enabled }}
{{- $tenant := .Values.tenant }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.serviceAccountName }}
  namespace: {{ $tenant.name | lower }}
  labels:
    {{- include "tnr.labels" . | nindent 4 }}
    platform.rezakara.demo/tenant: {{ $tenant.name | lower }}

---
{{- end }}
