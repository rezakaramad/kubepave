# Per-tenant SecretStore used by ExternalSecrets in the tenant namespace to read
# the tenant's own secrets from the management Vault.
#
# Auth is JWT: the tenant ServiceAccount's projected token is validated by the
# jwt-workload-tenants backend, and the identity-templated tenant-policy scopes
# access to tenants/<tenant>/* only — a tenant cannot reach another tenant's path.

{{- if and .Values.vault.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1") }}

{{- $tenant := .Values.tenant }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.vault.secretStore.name }}
  namespace: {{ $tenant.name | lower }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.mount | quote }}
      version: "v2"
      {{- with .Values.vault.caProvider }}
      caProvider:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      auth:
        jwt:
          path: {{ .Values.vault.authBackend | quote }}
          role: {{ $tenant.name | lower | quote }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: {{ .Values.vault.serviceAccountName }}
              namespace: {{ $tenant.name | lower }}
            audiences:
              - {{ .Values.vault.audience | quote }}

---
{{- end }}
