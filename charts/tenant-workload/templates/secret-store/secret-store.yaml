# Per-tenant SecretStore used by ExternalSecrets in the tenant namespace.
#
# On local/kind: provider is OpenBao JWT (vault.enabled=true). Data lives in the
# tenant's child OpenBao namespace tenants/<tenant> (KV v2 mount `kv`), but the
# shared jwt-development-tenants auth backend lives at the ROOT namespace. ESO
# supports this split: it authenticates in auth.namespace (root, "") then uses
# the resulting token against the data namespace. The auth role and the
# serviceAccountRef namespace are per-tenant, so this block is templated.
# On GCP: vault.enabled=false and secretStore.provider is set in values-gcp.yaml
# (gcpsm + Workload Identity), rendered as-is via toYaml.

{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}

{{- $tenant := .Values.tenant }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ $tenant.name | lower }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    {{- if .Values.vault.enabled }}
    vault:
      server: "https://openbao.mgmt.rezakara.demo"
      # DATA namespace: the tenant's isolated child namespace.
      namespace: {{ printf "%s/%s" .Values.vault.parentNamespace ($tenant.name | lower) | quote }}
      # KV v2 mount enabled inside that child namespace.
      path: "kv"
      version: "v2"
      caProvider:
        type: Secret
        name: root-ca
        key: tls.crt
      auth:
        # AUTH namespace: authenticate against the shared jwt-development-tenants
        # backend at the ROOT namespace ("") — different from the data namespace.
        namespace: ""
        jwt:
          path: "jwt-development-tenants"
          role: {{ $tenant.name | lower | quote }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "tenant-eso"
              namespace: {{ $tenant.name | lower }}
            audiences:
              - https://kubernetes.default.svc.cluster.local
    {{- else }}
    gcpsm:
      projectID: {{ include "tn.projectId" (dict "name" $tenant.tenantShortName "prefix" .Values.environmentPrefix) }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: "tenant-eso"
            namespace: {{ $tenant.name | lower }}
    {{- end }}

---
{{- end }}
