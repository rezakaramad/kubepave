# Per-tenant SecretStore used by ExternalSecrets in the tenant namespace.
#
# On local/kind: provider is Vault JWT (vault.enabled=true). The auth block is
# templated here because the role and serviceAccountRef namespace are per-tenant.
# On GCP: vault.enabled=false and secretStore.provider is set in values-gcp.yaml
# (gcpsm + Workload Identity), rendered as-is via toYaml.

{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}

{{- $tenant := .Values.tenant }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ $tenant.name | lower }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    {{- if .Values.vault.enabled }}
    vault:
      server: "https://vault.mgmt.rezakara.demo"
      path: "tenants"
      version: "v2"
      caProvider:
        type: Secret
        name: root-ca
        key: tls.crt
      auth:
        jwt:
          path: "jwt-workload-tenants"
          role: {{ $tenant.name | lower | quote }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "tenant-eso"
              namespace: {{ $tenant.name | lower }}
            audiences:
              - https://kubernetes.default.svc.cluster.local
    {{- else }}
    gcpsm:
      projectID: {{ include "tn.projectId" (dict "name" $tenant.tenantShortName "prefix" .Values.environmentPrefix) }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: "tenant-eso"
            namespace: {{ $tenant.name | lower }}
    {{- end }}

---
{{- end }}
