tenant: null
# E.g.
# tenant:
#   name: payment
#   tenantShortName: pay
#   gcp:
#     aadGroupName: ACL.PLT.GCP.Tenant.Payment
#     pushAuthorizedGithubRepos:
#       - talktorubberduckdev/payment

selfSignedRootCA:
  enabled: false

issuerName: <upsert-in-env-values-file>

configConnector:
  enabled: false

vault:
  enabled: false
  # Shared per-cluster KV v2 mount (at the ROOT namespace) holding every
  # development tenant's secrets. The tenant SecretStore addresses this mount;
  # the token is path-scoped to <kvMount>/data/<tenant>/* by tenant-policy.
  # Only relevant when vault.enabled.
  kvMount: kv-development
  # Shared, identity-templated JWT role on the jwt-development-tenants backend.
  # The issued token self-scopes to the calling tenant's prefix via its alias
  # name, so a single role serves all tenants.
  role: tenant

environmentPrefix: <upsert-in-env-values-file>

# The GCP project ID where the GKE cluster runs.
# Used to construct the Workload Identity pool name (<project>.svc.id.goog) in the
managementGoogleProjectID: kara-mgmt

# Must be pinned to prevent breaking changes caused by future Pod Security Standard updates, especially in production.
podSecurity:
  enforceVersion: v1.33

gateway:
  # This is the default GatewayClass created by Traefik chart.
  gatewayClass: "traefik"

  # Upsert in environment values file.
  loadBalancerIPs: []
