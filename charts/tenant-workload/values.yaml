tenant: null
# E.g.
# tenant:
#   name: payment
#   tenantShortName: pay
#   gcp:
#     aadGroupName: ACL.PLT.GCP.Tenant.Payment
#     pushAuthorizedGithubRepos:
#       - talktorubberduckdev/payment

selfSignedRootCA:
  enabled: false

issuerName: <upsert-in-env-values-file>

configConnector:
  enabled: false

vault:
  enabled: false
  # ServiceAccount created in the tenant namespace to authenticate to the
  # management Vault. Must match tenant-management's vault.serviceAccountName so
  # the AuthBackendRole's boundSubject lines up with this SA.
  serviceAccountName: tenant-secrets
  # JWT auth backend on the management Vault that validates the tenant SA token.
  # Must match tenant-management's vault.authBackend.
  authBackend: jwt-workload-tenants
  # KV v2 mount holding per-tenant secret paths (tenants/<tenant>/*).
  mount: tenants
  # Audience the tenant SA token is minted with. Must match the AuthBackendRole
  # boundAudiences and tenant-management's vault.audience.
  audience: https://kubernetes.default.svc.cluster.local
  # Management Vault address. Upsert the real value in the env values file.
  server: <upsert-in-env-values-file>
  # ESO SecretStore created in each tenant namespace.
  secretStore:
    name: vault-tenant
  # CA for the management Vault's TLS. root-ca is synced into the tenant
  # namespace by the root-ca ExternalSecret (see secret-store/root-ca.yaml).
  caProvider:
    type: Secret
    name: root-ca
    key: tls.crt

environmentPrefix: <upsert-in-env-values-file>

# The GCP project ID where the GKE cluster runs.
# Used to construct the Workload Identity pool name (<project>.svc.id.goog) in the
managementGoogleProjectID: kara-mgmt

# Must be pinned to prevent breaking changes caused by future Pod Security Standard updates, especially in production.
podSecurity:
  enforceVersion: v1.33

gateway:
  # This is the default GatewayClass created by Traefik chart.
  gatewayClass: "traefik"

  # Upsert in environment values file.
  loadBalancerIPs: []
