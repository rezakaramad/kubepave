{{- if .Values.oauth2Proxy.enabled }}

# Pulls the oauth2-proxy runtime secrets from Vault:
#   CLIENT_ID / CLIENT_SECRET  — reuse the Backstage Azure app registration
#   COOKIE_SECRET              — 32-byte random value for encrypting the session
#                                cookie; store in Vault at:
#                                backstage/oauth2-proxy  →  cookie_secret
#
# Generate a suitable value with:
#   python3 -c 'import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())'
# then store it in Vault:
#   vault kv put local/backstage/oauth2-proxy cookie_secret=<value>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
  name: oauth2-proxy-secrets
  namespace: backstage
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: backstage/azure/app
        property: client_id
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: backstage/azure/app
        property: client_secret
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: backstage/oauth2-proxy
        property: cookie_secret

{{- end }}
