apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: backstage
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
      postInitSQL:
        # Backstage creates a separate database per plugin (e.g. backstage_plugin_catalog)
        # at startup, so the app user needs CREATEDB privilege.
        - ALTER USER backstage CREATEDB
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
