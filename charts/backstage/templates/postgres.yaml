apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: backstage
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
