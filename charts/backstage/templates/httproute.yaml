apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    external-dns-create: "true"
  name: backstage
  namespace: backstage
spec:
  hostnames:
    - {{ .Values.httpRoute.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-traefik
      namespace: platform-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: backstage
          port: 7007
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
