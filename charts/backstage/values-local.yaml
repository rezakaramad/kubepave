secretStore:
  name: vault-local
  provider:
    vault:
      server: https://vault.mgmt.rezakara.demo
      path: local
      version: v2
      caProvider:
        type: Secret
        name: root-ca
        key: tls.crt
        namespace: backstage
      auth:
        jwt:
          path: jwt-management
          role: backstage
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: backstage
              namespace: backstage
            audiences:
              - https://kubernetes.default.svc.cluster.local

selfSignedRootCA:
  # Set to false if the cluster uses an external CA provider (e.g. cloud PKI, Let's Encrypt, etc.).
  enabled: true

backstage:
  backstage:
    # NOTE: Helm replaces (does not merge) list values across value files, so this
    # list must be COMPLETE — it fully overrides the extraEnvVars from values.yaml.
    extraEnvVars:
      # --- Database (CloudNativePG "postgres-app" secret) ---
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: password
      # --- Backend runtime config (app-config.production.yaml) ---
      - name: APP_BASE_URL
        value: https://backstage.mgmt.rezakara.demo
      # --- Frontend runtime config overrides ---
      # The frontend bundle is static and bakes in app-config.yaml (localhost) at
      # build time. app-backend injects any APP_CONFIG_* env var into the served
      # index.html at runtime, overriding those baked-in defaults. $(APP_BASE_URL)
      # is a Kubernetes dependent-variable reference (must be defined earlier).
      - name: APP_CONFIG_app_baseUrl
        value: $(APP_BASE_URL)
      - name: APP_CONFIG_backend_baseUrl
        value: $(APP_BASE_URL)
      - name: APP_CONFIG_auth_environment
        value: production

httpRoute:
  hostname: backstage.mgmt.rezakara.demo

oauth2Proxy:
  oidcIssuerUrl: https://login.microsoftonline.com/c6ba6fd6-0fdd-4458-ad98-0c292dd79188/v2.0
  redirectUrl: https://backstage.mgmt.rezakara.demo/oauth2/callback
