backstage:
  backstage:
    image:
      registry: ghcr.io
      repository: rezakaramad/backstage
      tag: latest

    extraEnvVars:
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: password
      - name: APP_BASE_URL
        value: <upsert-in-env-values-file>
      - name: AUTH_MICROSOFT_TENANT_ID
        value: <upsert-in-env-values-file>
      # Frontend runtime config overrides (see values-local.yaml for details).
      # app-backend injects APP_CONFIG_* env vars into the static frontend bundle
      # at runtime, overriding the localhost defaults baked in at build time.
      - name: APP_CONFIG_app_baseUrl
        value: $(APP_BASE_URL)
      - name: APP_CONFIG_backend_baseUrl
        value: $(APP_BASE_URL)
      - name: APP_CONFIG_auth_environment
        value: production

    extraEnvVarsSecrets:
      - backstage-secrets

    # Backstage runs DB migrations on startup — give it time before probing
    readinessProbe:
      httpGet:
        path: /.backstage/health/v1/readiness
        port: 7007
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3

    livenessProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 3

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  serviceAccount:
    create: true

  # Use CloudNativePG instead of the bundled postgresql subchart
  postgresql:
    enabled: false

  service:
    type: ClusterIP

# SecretStore reference for ExternalSecret (auth credentials)
secretStore:
  name: <upsert-in-env-values-file>
  provider: {}

# HTTPRoute hostname and gateway — overridden per environment
httpRoute:
  hostname: <upsert-in-env-values-file>

# SecretStore to pull secrets via ExternalSecret
secretStore:
  name:  <upsert-in-env-values-file>
  provider: {}

# Azure AD identity for OIDC client secret via ExternalSecret.
azureIdentity:
  enabled: true
