backstage:
  backstage:
    image:
      registry: ghcr.io
      repository: backstage/backstage
      tag: latest

    # app-config.yaml overrides via ConfigMap
    appConfig:
      app:
        title: Backstage
        baseUrl: <upsert-in-env-values-file>
      backend:
        baseUrl: <upsert-in-env-values-file>
        cors:
          origin: <upsert-in-env-values-file>
        database:
          client: pg
          connection:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
      auth:
        environment: production
        providers:
          microsoft:
            production:
              clientId: ${AUTH_MICROSOFT_CLIENT_ID}
              clientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
              tenantId: ${AUTH_MICROSOFT_TENANT_ID}
              signIn:
                resolvers:
                  - resolver: emailMatchingUserEntityProfileEmail

    extraEnvVars:
      - name: POSTGRES_HOST
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: host
      - name: POSTGRES_PORT
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: port
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: username
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-app
            key: password
      - name: AUTH_MICROSOFT_TENANT_ID
        value: <upsert-in-env-values-file>

    extraEnvVarsSecrets:
      - backstage-secrets

    # Backstage runs DB migrations on startup — give it time before probing
    readinessProbe:
      httpGet:
        path: /.backstage/health/v1/readiness
        port: 7007
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3

    livenessProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
        scheme: HTTP
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 3

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  serviceAccount:
    create: true

  # Use CloudNativePG instead of the bundled postgresql subchart
  postgresql:
    enabled: false

  service:
    type: ClusterIP

# SecretStore reference for ExternalSecret (auth credentials)
secretStore:
  name: <upsert-in-env-values-file>
  provider: {}

# HTTPRoute hostname and gateway — overridden per environment
httpRoute:
  hostname: <upsert-in-env-values-file>


# SecretStore to pull secrets via ExternalSecret
secretStore:
  name:  <upsert-in-env-values-file>
  provider: {}
