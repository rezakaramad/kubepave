# With tenancy on, the tenant is whatever the caller puts in X-Scope-OrgID, so only trusted components may reach Tempo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Writes: the otelcol-gateway stamps the tenant from the namespace label.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
    - from:
        # Reads: Grafana sends the tenants its datasource is allowed to see.
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 3200
    # Tempo talks to itself over memberlist and gRPC.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
