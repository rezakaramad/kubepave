otelCollector:
  # The management routes are only resolvable reliably without the search list (see README).
  dnsConfig:
    options:
      - name: ndots
        value: "1"

  # Only the public certificate is mounted, never the private key in the same secret.
  extraVolumes:
    - name: root-ca
      secret:
        secretName: root-ca
        items:
          - key: ca.crt
            path: ca.crt
    - name: gateway-token
      projected:
        sources:
          - serviceAccountToken:
              audience: otel-gateway
              expirationSeconds: 3600
              path: token
  extraVolumeMounts:
    - name: root-ca
      mountPath: /etc/root-ca
      readOnly: true
    - name: gateway-token
      mountPath: /var/run/secrets/otel-gateway
      readOnly: true

  alternateConfig:
    processors:
      resource/cluster:
        attributes:
          - key: k8s.cluster.name
            value: development
            action: upsert
    exporters:
      otlphttp/gateway:
        endpoint: https://gateway-collector-oidc.mgmt.rezakara.demo
        tls:
          ca_file: /etc/root-ca/ca.crt
