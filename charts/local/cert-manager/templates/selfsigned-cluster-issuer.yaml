{{/*
Step 1/3 — management only (rootCA.mint: true)

A self-signed ClusterIssuer is not automatically trusted by anyone; it signs whatever
certificate asks for it. We use it for exactly one purpose: to sign the 'root-ca'
Certificate in the next step. It is never referenced again after that.
This is only needed on the management cluster, because workload clusters never mint their own root CA; 
they copy it from management via 'setup-trust.sh'.
*/}}

{{- if and .Values.rootCA.enabled .Values.rootCA.mint (.Capabilities.APIVersions.Has "cert-manager.io/v1/ClusterIssuer") }}

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  selfSigned: {}

{{- end }}
