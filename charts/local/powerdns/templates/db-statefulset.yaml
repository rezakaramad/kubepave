apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: powerdns-db
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: powerdns-db
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: powerdns-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powerdns-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
