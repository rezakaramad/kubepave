apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    external-dns-create: "true"
  name: tempo
  namespace: observability
spec:
  hostnames:
  - tempo.mgmt.rezakara.demo
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: default-traefik
    namespace: platform-system
  rules:
  # OTLP/HTTP ingest for collectors in other clusters
  - backendRefs:
    - group: ""
      kind: Service
      name: tempo
      port: 4318
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
