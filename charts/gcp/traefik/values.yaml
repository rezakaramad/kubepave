defaulGateway:
  # The hostname for defeault gateway resource in management cluster
  hostname: ''

  allowedRoutes: {}

traefik:
  fullnameOverride: traefik
  deployment:
    replicas: 1
    
    # Additional deployment labels
    labels:
      app.kubernetes.io/component: gateway

    # Labels applied to Traefik pods (not the Deployment). NetworkPolicies select pods by label,
    # so this is required for any NetworkPolicy that allows ingress traffic to the gateway.
    podLabels:
      app.kubernetes.io/component: gateway

  # Don't create a default IngressClass for Traefik
  ingressClass.enabled: false

  # Don't create a default gateway
  gateway.enabled: false

  # Don't enable the dashboard
  api.dashboard: false

  providers:
    # Disable Traefik's built-in IngressRoute CRDs. We use Gateway API (HTTPRoute) instead.
    kubernetesCRD:
      enabled: false

    # Disable Traefik's built-in Ingress controller. We use Gateway API (HTTPRoute) instead.
    kubernetesIngress:
      enabled: false

    # Enabled: using Gateway API (HTTPRoute) instead of Traefik's proprietary IngressRoute CRDs
    kubernetesGateway:
      enabled: true
      # when true, Traefik would provision a cloud load balancer for every Gateway resource automatically.
      # With false, you control LB creation yourself (e.g. via a static IP annotation on the Gateway),
      # which is what you want to avoid unexpected cloud LB costs.
      nativeLBByDefault: false

  # Logs configuration for Traefik
  logs:
    general:
      format: "json"
      level: "WARN"
