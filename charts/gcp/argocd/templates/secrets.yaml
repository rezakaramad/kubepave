{{- /*
Registers external clusters with ArgoCD by creating a Secret per cluster with the
'argocd.argoproj.io/secret-type: cluster' label that ArgoCD watches.

No static credentials are stored here. Instead, execProviderConfig runs `argocd-k8s-auth gcp`
at sync time, which uses Workload Identity to exchange the ArgoCD pod's GCP token for a
GKE access token on the fly — no kubeconfig, no service account keys, no rotation needed.

Clusters are defined in .Values.clusterCredentials:
  - name: the ArgoCD cluster name (lowercase letters and hyphens only)
  - server: the GKE DNS endpoint URL (https://<hash>.gke.goog)
  - environmentPrefix: short label for the environment (e.g. wl, dev, prod)
*/ -}}

{{- range $cluster := .Values.clusterCredentials }}
{{- if not (regexMatch "^[a-z-]+$" $cluster.name) -}}
{{- fail (printf "clusterCredentials name must contain only lowercase letters and hyphens (a-z-): [%s]" $cluster.name) }}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $cluster.name }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    argocd.jysk.tech/cluster-type: tenant
    argocd.jysk.tech/environment: {{ $cluster.environmentPrefix }}
type: Opaque
stringData:
  name: {{ $cluster.name }}
  server: {{ $cluster.server }}
  config: |
    {
      "execProviderConfig": {
        "command": "argocd-k8s-auth",
        "args": ["gcp"],
        "apiVersion": "client.authentication.k8s.io/v1beta1"
      }
    }
---
{{- end }}
