{{- $tenant := .Values.tenant }}
{{- include "tpr.gcp.tenant.validateName" $tenant.name }}
{{- range $tenantEnvironment := $.Values.gcp.tenantEnvironments }}
{{- $projectId := include "tpr.gcp.projectId" (dict "name" $tenant.tenantShortName "prefix" $tenantEnvironment.prefix) -}}

{{/*
Create a GCP project per tenant and per environment under the 'Tenant Environments' folder.
*/}}
apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
kind: Project
metadata:
  name: {{ $projectId }}
  annotations:
    cnrm.cloud.google.com/auto-create-network: "false"
    cnrm.cloud.google.com/deletion-policy: "abandon"
  labels:
    {{- include "tpr.labels" . | nindent 4 }}
    platform.talktorubberduck.dev/tenant: {{ $tenant.name | lower }}
    platform.talktorubberduck.dev/environment: {{ $tenantEnvironment.prefix | lower }}
spec:
  name: {{ include "tpr.gcp.projectDisplayName" (dict "name" $tenant.name "prefix" $tenantEnvironment.prefix) }}
  folderRef:
    external: {{ $tenantEnvironment.folderId | quote }}
  billingAccountRef:
    external: {{ $.Values.gcp.billingAccountId | quote }}
  resourceID: {{ $projectId }}

---

{{/*
Attach the tenant project as a service project to the kara-shared Shared VPC host project.
This allows tenant resources (Valkey, Cloud SQL, etc.) to use subnets from kara-shared.
*/}}
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSharedVPCServiceProject
metadata:
  name: {{ $projectId }}-shared-vpc
  annotations:
    cnrm.cloud.google.com/deletion-policy: "abandon"
  labels:
    {{- include "tpr.labels" . | nindent 4 }}
    platform.talktorubberduck.dev/tenant: {{ $tenant.name | lower }}
    platform.talktorubberduck.dev/environment: {{ $tenantEnvironment.prefix | lower }}
spec:
  hostProjectRef:
    external: {{ $.Values.gcp.sharedVpcHostProjectID | quote }}
  serviceProjectRef:
    name: {{ $projectId }}

---
{{- end }}
