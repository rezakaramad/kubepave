{{- if and .Values.clusterSecretStore.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1") }}
# A ClusterSecretStore is only used to access to shared secrets like 'root-ca'
# for bootstrapping other SecretStores in other namespaces. 
#
# In local setup, this SecretStore authenticates with the 'eso-shared' Vault role, which is
# bound to the 'eso-shared-policy'. That policy grants read-only access to
# 'local/data/shared/*' only - no other Vault paths are reachable through
# this store, regardless of which namespace creates the ExternalSecret.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name:  {{ .Values.clusterSecretStore.name }}
spec:
  provider:
    {{- toYaml .Values.clusterSecretStore.provider | nindent 4 }}

---
{{- end }}
