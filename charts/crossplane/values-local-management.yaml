githubProvider:
  enabled: true
  providerPackage: xpkg.upbound.io/crossplane-contrib/provider-upjet-github:v0.19.0  

keycloakProvider:
  enabled: true
  providerPackage: xpkg.upbound.io/crossplane-contrib/provider-keycloak:v2.7.2

vaultProvider:
  enabled: true
  providerPackage: xpkg.upbound.io/upbound/provider-vault:v4.0.0
  agentImage: quay.io/openbao/openbao:2.6.1
  address: http://openbao.openbao.svc.cluster.local:8200
  caCertSecret: root-ca
  # Mount accessor of the Vault `oidc` auth method, captured at bootstrap by
  # setup-vault.sh and saved to .platform.env as VAULT_OIDC_ACCESSOR. Paste it
  # here once after the first bootstrap and commit. When set, the xtenantargo
  # composition turns on per-tenant Vault OIDC SSO (Policy/Group/GroupAlias) in
  # the tenant-management chart. Leave empty to keep human SSO objects off.
  oidcAccessor: "auth_oidc_de251605"

entraIdProvider:
  enabled: true
  providerPackage: xpkg.upbound.io/upbound/provider-azuread:v2.2.1
  auth:
    method: secret
  activatedResources:
    - applications.applications.azuread.m.upbound.io
    - principals.serviceprincipals.azuread.m.upbound.io
    - approles.applications.azuread.m.upbound.io
    - roleassignments.app.azuread.m.upbound.io
    - federatedidentitycredentials.applications.azuread.m.upbound.io
    - groups.groups.azuread.m.upbound.io

secretStore:
  provider:
    vault:
      auth:
        jwt:
          path: jwt-management

compositeResources:
  xTenantEntra:
    enabled: true
    packageTag: v0.2.3

  xTenantArgo:
    enabled: true
    packageTag: v0.1.5
