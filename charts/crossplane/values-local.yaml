selfSignedRootCA:
  # Set to false if the cluster uses an external CA provider (e.g. cloud PKI, Let's Encrypt, etc.).
  enabled: true

secretStore:
  name: vault-local
  provider:
    vault:
      caProvider:
        key: tls.crt
        name: root-ca
        namespace: crossplane-system
        type: Secret
      path: local
      server: https://vault.mgmt.rezakara.demo
      version: v2
      auth:
        jwt:
          path: <upsert-in-env-values-file>
          role: crossplane
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: crossplane
              namespace: crossplane-system
            audiences:
              - https://kubernetes.default.svc.cluster.local

compositeResources:
  xTenantEntra:
    enabled: true
    packageTag: v0.1.0

  xTenantArgo:
    enabled: true
    packageTag: v0.1.1
