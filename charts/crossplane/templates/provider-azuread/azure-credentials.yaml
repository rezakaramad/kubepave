{{- if .Values.azureADProvider.enabled }}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-azure-credentials
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: {{ .Values.azureADProvider.secretStoreRef.name }}
    kind: {{ .Values.azureADProvider.secretStoreRef.kind }}
  target:
    name: crossplane-azure-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      mergePolicy: Replace
      data:
        credentials: |
          {
            "tenantId": "{{ `{{ .tenant_id }}` }}",
            "clientId": "{{ `{{ .client_id }}` }}",
            "clientSecret": "{{ `{{ .client_secret }}` }}",
            "environment": "public"
          }
  data:
    - secretKey: client_id
      remoteRef:
        key: crossplane/azure-app
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: crossplane/azure-app
        property: client_secret
    - secretKey: tenant_id
      remoteRef:
        key: crossplane/azure-app
        property: tenant_id

---
{{- end }}
