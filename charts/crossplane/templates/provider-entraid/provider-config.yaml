{{- if .Values.entraIdProvider.enabled }}

apiVersion: azuread.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: azuread
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- if eq .Values.entraIdProvider.auth.method "oidc" }}
  tenantID: {{ .Values.entraIdProvider.auth.tenantID }}
  clientID: {{ .Values.entraIdProvider.auth.clientID }}
  oidcTokenFilePath: /var/run/secrets/tokens/azure-token
  credentials:
    source: OIDCTokenFile
  {{- else }}
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: azuread
      key: credentials
  {{- end }}

---
{{- end }}
