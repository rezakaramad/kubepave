{{- if .Values.compositeResources.xTenantArgo.enabled }}

# Grant the Crossplane service account permission to manage ApplicationSet
# resources. Crossplane composes ApplicationSets via the xtenantargo function.
# This must be a ClusterRole (not a namespaced Role): Crossplane's composite
# controller starts a cluster-scoped informer to observe composed resources, so
# it performs list/watch across all namespaces. A namespaced Role only satisfies
# the create/patch calls into a single namespace and leaves the informer unable
# to sync, failing with "Timeout: failed waiting for Informer to sync".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-applicationset-manager
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets", "applicationsets/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-applicationset-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-applicationset-manager
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system

---
{{- end }}
