{{- if .Values.compositeResources.xTenantArgo.enabled }}

# Grant the Crossplane service account permission to manage ApplicationSet
# resources in the argocd namespace. Crossplane composes ApplicationSets via
# the xtenantargo function; without this Role the compose step fails with a
# "forbidden: cannot patch resource applicationsets" error.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-applicationset-manager
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets", "applicationsets/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-applicationset-manager
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-applicationset-manager
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system

---
{{- end }}
