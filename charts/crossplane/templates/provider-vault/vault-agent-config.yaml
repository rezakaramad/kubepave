{{- if .Values.vaultProvider.enabled }}

# auto_auth logs in to the jwt-management backend using the provider-vault
# ServiceAccount token (projected with the Vault audience). The resulting
# short-lived Vault token is written to the shared /vault/secrets/token sink,
# which the provider-vault container reads each reconcile. The agent keeps the
# token renewed and re-authenticates when it expires — no static secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-vault-agent-config
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  config.hcl: |
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = {{ .Values.vaultProvider.address | quote }}
      ca_cert = "/etc/vault-tls/tls.crt"
    }

    auto_auth {
      method "jwt" {
        mount_path = "auth/jwt-management"
        config = {
          role = "provider-vault"
          path = "/var/run/secrets/tokens/vault-token"
        }
      }

      sink "file" {
        config = {
          path = "/vault/secrets/token"
        }
      }
    }

{{- end }}
