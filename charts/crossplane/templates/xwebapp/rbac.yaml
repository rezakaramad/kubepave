{{- if .Values.compositeResources.xWebApp.enabled }}

# Grant the Crossplane service account permission to manage the resources the
# xwebapp function composes. Like the ApplicationSet role, this must be a
# ClusterRole: the composite controller list/watches composed resources across
# all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-xwebapp-manager
rules:
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "httproutes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-xwebapp-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-xwebapp-manager
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system

---
{{- end }}
