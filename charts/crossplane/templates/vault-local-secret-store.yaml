{{- if and .Values.secretStore.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1") }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ .Values.secretStore.namespace }}
spec:
  provider:
    {{- toYaml .Values.secretStore.provider | nindent 4 }}

---
{{- end }}
