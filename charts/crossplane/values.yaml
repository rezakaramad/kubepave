githubProvider:
  enabled: false
  providerPackage: <upsert-in-env-values-file>
  activatedResources:
  - repositories.repo.github.m.upbound.io
  - repositoryfiles.repo.github.m.upbound.io

keycloakProvider:
  enabled: false
  providerPackage: <upsert-in-env-values-file>

entraIdProvider:
  enabled: false
  providerPackage: <upsert-in-env-values-file>
  activatedResources: []
  # auth.method controls how the provider authenticates to Azure AD.
  # "secret" = Vault-backed ExternalSecret (local/non-GCP clusters)
  # "oidc"   = GKE Workload Identity token file (GCP clusters)
  auth:
    method: <upsert-in-env-values-file> # secret | oidc
    # You need to set the below values when method=oidc (GCP Workload Identity)
    tenantID: <upsert-in-env-values-file>
    clientID: <upsert-in-env-values-file>

vaultProvider:
  enabled: false
  providerPackage: <upsert-in-env-values-file>
  # Vault Agent sidecar image (used by the DeploymentRuntimeConfig to obtain a
  # short-lived Vault token via JWT auth for the provider container).
  agentImage: <upsert-in-env-values-file>
  # Vault server address used by both the Vault Agent sidecar and the provider.
  # Use https:// for TLS-enabled Vault (production); http:// disables TLS (local dev).
  address: <upsert-in-env-values-file>
  # Kubernetes Secret containing the CA certificate (key: tls.crt) used to
  # verify the Vault server's TLS certificate. Must exist in crossplane-system.
  # Ignored when address uses http://.
  caCertSecret: <upsert-in-env-values-file>
  # Mount accessor of the Vault `oidc` auth method (human tenant-operator SSO).
  # Captured at bootstrap by setup-vault.sh (VAULT_OIDC_ACCESSOR in .platform.env).
  # Paste once and commit to enable per-tenant Vault OIDC objects via xtenantargo.
  # Empty = human Vault SSO objects stay off.
  oidcAccessor: ""

compositeResources:
  xTenantEntra:
    enabled: false
    package: ghcr.io/rezakaramad/function-xtenantentra
    packageTag: <upsert-in-env-values-file>

  xTenantArgo:
    enabled: false
    package: ghcr.io/rezakaramad/function-xtenantargo
    packageTag: <upsert-in-env-values-file>

selfSignedRootCA:
  # Set to false if the cluster uses an external CA provider (e.g. cloud PKI, Let's Encrypt, etc.).
  enabled: false

secretStore: 
  name: <upsert-in-env-values-file>
  provider: {}

configConnectorContext:
  enabled: false
  googleServiceAccount: <upsert-in-env-values-file>
