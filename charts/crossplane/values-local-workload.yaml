githubProvider:
  enabled: true
  # Crossplane needs to be able to read the GitHub app credentials from a secret store.
  # The secret store can be a ClusterSecretStore or a SecretStore depending on the cluster where Crossplane is deployed.
  # In workload cluster, the store is namespace-scoped (SecretStore).
  secretStoreRef:
    name: vault-local
    kind: SecretStore

keycloakProvider:
  enabled: true

azureADProvider:
  enabled: true
  secretStoreRef:
    name: vault-local
    kind: SecretStore

secretStore:
  enabled: true
  name: vault-local
  namespace: crossplane-system
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes-workload
          role: crossplane
          serviceAccountRef:
            name: crossplane
            namespace: crossplane-system
      caProvider:
        key: tls.crt
        name: root-ca
        namespace: platform-system
        type: Secret
      path: local/crossplane
      server: https://vault.mgmt.rezakara.demo
      version: v2
