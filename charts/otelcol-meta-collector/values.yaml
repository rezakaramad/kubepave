otelCollector:
  # Receives the internal metrics of every other collector in this cluster.
  mode: deployment
  replicaCount: 1
  nameOverride: meta-collector
  fullnameOverride: meta-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  # Only the other collectors push here, over OTLP/HTTP.
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    receivers:
      otlp:
        protocols:
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s

    service:
      extensions:
        - health_check
      # Reports its own metrics straight to Mimir so it never monitors itself through itself.
      # The reader and its endpoint are set per cluster in values-local-<cluster>.yaml.
      telemetry:
        resource:
          service.name: meta-collector
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlphttp/mimir]
