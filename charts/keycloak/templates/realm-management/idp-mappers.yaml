{{- range .Values.entraId.groupMappings }}
apiVersion: identityprovider.keycloak.m.crossplane.io/v1alpha1
kind: IdentityProviderMapper
metadata:
  name: {{ .name }}
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  forProvider:
    realm: management
    identityProviderAlias: azure
    name: {{ .name }}
    identityProviderMapper: oidc-advanced-group-idp-mapper

    extraConfig:
      syncMode: FORCE
      claim: groups
      claim.value: {{ .aadGroupId }}
      group: {{ .keycloakGroup }}

  providerConfigRef:
    kind: ProviderConfig
    name: keycloak

---
{{- end }}
{{- end }}