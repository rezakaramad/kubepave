{{- if .Capabilities.APIVersions.Has "identityprovider.keycloak.m.crossplane.io/v1alpha1/IdentityProviderMapper" }}

apiVersion: identityprovider.keycloak.m.crossplane.io/v1alpha1
kind: IdentityProviderMapper
metadata:
  name: azure-email
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  forProvider:
    realm: management
    identityProviderAlias: azure
    name: azure-email
    identityProviderMapper: oidc-user-attribute-idp-mapper

    extraConfig:
      syncMode: FORCE
      claim: email
      user.attribute: email

  providerConfigRef:
    kind: ProviderConfig
    name: keycloak

---

apiVersion: identityprovider.keycloak.m.crossplane.io/v1alpha1
