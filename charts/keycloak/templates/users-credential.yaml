apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: SecretStore
  target:
    name: keycloak-bootstrap
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: keycloak/bootstrap
        property: username
    - secretKey: password
      remoteRef:
        key: keycloak/bootstrap
        property: password
    - secretKey: disabled
      remoteRef:
        key: keycloak/bootstrap
        property: disabled

