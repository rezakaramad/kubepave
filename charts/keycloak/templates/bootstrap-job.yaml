apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 260
  template:
    spec:
      serviceAccountName: keycloak
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              KEYCLOAK_SERVICE_NAME=keycloak-service
              KEYCLOAK_SERVICE_PORT=8080
              KEYCLOAK_URL=http://$KEYCLOAK_SERVICE_NAME:$KEYCLOAK_SERVICE_PORT
              CLIENT_ID="crossplane-admin"
              REALM="master"
              VAULT_PATH="kv/keycloak/crossplane"

              echo "🔐 Authenticate to Keycloak"
              LOGIN_SUCCESS=false
              for i in {1..12}; do
                if /opt/keycloak/bin/kcadm.sh config credentials \
                  --realm $REALM \
                  --server "$KEYCLOAK_URL" \
                  --user "$ADMIN_USER" \
                  --password "$ADMIN_PASSWORD"; then
                  LOGIN_SUCCESS=true
                  break
                fi
                echo "🛑 Login not ready yet"
                sleep 5
              done
              [ "$LOGIN_SUCCESS" != "true" ] && echo "🛑 ERROR: Keycloak not ready for authentication" && exit 1

              echo "🔐 Login to OpenBao"
              export VAULT_ADDR="http://openbao.openbao:8200"
              # Platform-component secrets live in the OpenBao `platform` namespace.
              # The vault CLI is API-compatible with OpenBao and forwards this as
              # the X-Vault-Namespace header for both login and kv writes.
              export VAULT_NAMESPACE="platform"

              # Wait for Vault API
              echo "⏳ Waiting for Vault API"
              for i in {1..30}; do
                if curl -sf "$VAULT_ADDR/v1/sys/health" >/dev/null; then
                  break
                fi
                sleep 2
              done

              SA_TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"
              if [[ ! -f "$SA_TOKEN_PATH" ]]; then
                echo "🛑 ServiceAccount token not found"
                exit 1
              fi

              # Authenticate (retry because auth backend may not be ready yet)
              echo "🔑 Authenticating with Vault JWT auth"
              LOGIN_OK=false
              for i in {1..10}; do
                VAULT_TOKEN="$(vault write -field=token auth/jwt-management/login \
                  role=keycloak \
                  jwt=@"$SA_TOKEN_PATH" 2>/dev/null || true)"

                if [[ -n "$VAULT_TOKEN" && "$VAULT_TOKEN" != "null" ]]; then
                  LOGIN_OK=true
                  break
                fi

                sleep 3
              done

              if [[ "$LOGIN_OK" != "true" ]]; then
                echo "🛑 Vault authentication failed"
                exit 1
              fi

              export VAULT_TOKEN
              echo "✅ Vault authentication successful"

              echo "🤖 Ensure Crossplane bootstrap client exists"

              echo "🔎 Check if client exists"
              CID=$(kcadm.sh get clients \
                -r "$REALM" \
                -q clientId="$CLIENT_ID" \
                --fields id \
                --format csv --noquotes | head -n1)

              if [[ -z "$CID" ]]; then
                echo "➕ Create client $CLIENT_ID"

                kcadm.sh create clients \
                  -r "$REALM" \
                  -s "clientId=$CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false

                # Wait until client appears
                for i in {1..20}; do
                  CID=$(kcadm.sh get clients \
                    -r "$REALM" \
                    -q clientId="$CLIENT_ID" \
                    --fields id \
                    --format csv \
                    --noquotes | head -n1)
                  if [[ -n "$CID" ]]; then
                    SA_UID=$(kcadm.sh get "clients/$CID/service-account-user" \
                      -r "$REALM" \
                      --fields id \
                      --format csv \
                      --noquotes 2>/dev/null || true)
                    [[ -n "$SA_UID" ]] && break
                  fi
                  sleep 1
                done
              else
                echo "🤷 Client already exists"
              fi

              if [[ -z "$CID" ]]; then
                echo "🛑 Failed to resolve client ID"
                exit 1
              fi

              # ---- Resolve service account ----
              echo "🔎 Resolve service account"
              if [[ -z "$SA_UID" ]]; then
                SA_UID=$(kcadm.sh get "clients/$CID/service-account-user" \
                  -r "$REALM" \
                  --fields id \
                  --format csv --noquotes)
              fi

              if [[ -z "$SA_UID" ]]; then
                echo "🛑 Failed to resolve service account user"
                exit 1
              fi

              echo "Service account UID: $SA_UID"

              # Grant admin role (idempotent) ----
              echo "🛡️ Ensure admin role"
              HAS_ADMIN=$(kcadm.sh get-roles \
                -r "$REALM" \
                --uid "$SA_UID" \
                | jq -r '.[]?.name' \
                | grep -c '^admin$' || true)

              if [[ "$HAS_ADMIN" == "0" ]]; then
                kcadm.sh add-roles \
                  -r "$REALM" \
                  --uid "$SA_UID" \
                  --rolename admin
                echo "👑 Admin role granted"
              else
                echo "🟢 Admin role already present"
              fi

              # ---- Fetch client secret ----
              echo "🔑 Fetch client secret"
              CLIENT_SECRET=$(kcadm.sh get "clients/$CID/client-secret" -r "$REALM" | jq -r .value)

              if [[ -z "$CLIENT_SECRET" || "$CLIENT_SECRET" == "null" ]]; then
                echo "🛑 Failed to fetch secret"
                exit 1
              fi

              echo "📤 Save Crossplane client secret in Vault"
              vault kv put "$VAULT_PATH" \
                client_id="$CLIENT_ID" \
                client_secret="$CLIENT_SECRET" >/dev/null
              
              echo "✅ Crossplane client stored in Vault"

              echo "🎉 Bootstrap phase completed"
          env:
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

---
