entraId:
  tenantId: c6ba6fd6-0fdd-4458-ad98-0c292dd79188
  syncMode: IMPORT
  groupMappings:
    - name: azure-platform-admins
      aadGroupId: 9b207afe-3824-482f-8985-e2337a7f7e9b
      keycloakGroup: /platform-admins

secretStore:
  name: vault-local
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes-management
          role: keycloak
          serviceAccountRef:
            name: keycloak
            namespace: keycloak
      caProvider:
        key: tls.crt
        name: root-ca
        namespace: keycloak
        type: Secret
      path: local
      server: https://vault.mgmt.rezakara.demo
      version: v2
