openbao:
  server:
    standalone:
      enabled: true

    postStart:
      - /bin/sh
      - -c
      - |
        set -euo pipefail
        export BAO_ADDR=http://127.0.0.1:8200

        echo "=== OpenBao bootstrap starting ==="

        INIT_FILE=/openbao/data/init.txt

        ########################################
        # 1. Initialize (only once)
        ########################################

        if [ ! -f "$INIT_FILE" ]; then
          echo "Initializing OpenBao..."

          until bao operator init -key-shares=1 -key-threshold=1 > "$INIT_FILE" 2>/dev/null; do
            sleep 2
          done

          echo "OpenBao initialized"
        else
          echo "OpenBao already initialized"
        fi

        ########################################
        # 2. Read keys
        ########################################

        UNSEAL_KEY=$(grep "Unseal Key 1:" "$INIT_FILE" | awk '{print $4}')
        ROOT_TOKEN=$(grep "Initial Root Token:" "$INIT_FILE" | awk '{print $4}')

        ########################################
        # 3. Unseal
        ########################################

        echo "Unsealing OpenBao..."

        until bao operator unseal "$UNSEAL_KEY" >/dev/null 2>&1; do
          sleep 2
        done

        echo "OpenBao unsealed"

        ########################################
        # 4. Authenticated configuration
        ########################################
        #
        # Path-based topology (single root namespace; tenants are isolated by
        # PATH + ACL, never by namespace):
        #
        #   Everything lives in the root namespace. There are three root KV v2
        #   mounts:
        #     kv/              — platform-component secrets (paths kv/data/<component>/*).
        #     kv-management/   — tenant secrets for management-cluster tenants
        #                        (kv-management/data/<tenant>/*).
        #     kv-development/  — tenant secrets for development-cluster tenants
        #                        (kv-development/data/<tenant>/*).
        #
        #   Auth + policy stay centrally owned by the platform team, never
        #   self-administered by tenants. The jwt-management / jwt-development
        #   platform backends, the shared jwt-development-tenants backend + the
        #   identity-templated tenant-policy, and the central human OIDC method are
        #   all added by setup-openbao.sh (which needs cluster API access for JWKS).
        #
        # This postStart hook only handles the parts that need no cluster API
        # access: init/unseal, the KV engines, and all ACL policies. JWT/JWKS/OIDC
        # configuration is done by setup-openbao.sh.

        export BAO_TOKEN="$ROOT_TOKEN"

        ########################################
        # 4a. KV engines (root namespace)
        ########################################

        echo "Ensuring KV engines exist..."

        # Platform-component secrets.
        bao secrets list 2>/dev/null | grep -q '^kv/' || \
          bao secrets enable -path=kv kv-v2

        # Per-cluster tenant secret stores. Tenants are isolated by path prefix
        # (kv-<cluster>/data/<tenant>/*), enforced by the identity-templated
        # tenant-policy — not by a namespace boundary.
        bao secrets list 2>/dev/null | grep -q '^kv-management/' || \
          bao secrets enable -path=kv-management kv-v2

        bao secrets list 2>/dev/null | grep -q '^kv-development/' || \
          bao secrets enable -path=kv-development kv-v2

        ########################################
        # 4c. Platform ACL policies (root namespace)
        #
        # All platform secrets live under the root `kv` KV v2 mount, so paths are
        # `kv/data/<component>/*` (read) and `kv/metadata/<component>/*` (list).
        ########################################

        echo "Writing ESO shared policy..."

        bao policy write eso-shared-policy - <<EOF
        path "kv/metadata/shared/*" {
          capabilities = ["read", "list"]
        }

        path "kv/data/shared/*" {
          capabilities = ["read"]
        }
        EOF

        echo "Writing platform-system policy..."

        bao policy write eso-platform-system-policy - <<EOF
        path "kv/metadata/platform/*" {
          capabilities = ["read", "list"]
        }

        path "kv/data/platform/*" {
          capabilities = ["read"]
        }
        EOF

        echo "Writing Keycloak ESO policy..."

        bao policy write keycloak-policy - <<'EOF'
        path "kv/data/keycloak/*" {
          capabilities = ["read", "create", "update", "patch"]
        }

        path "kv/metadata/keycloak/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing Crossplane policy..."

        bao policy write crossplane-policy - <<'EOF'
        path "kv/data/crossplane/*" {
          capabilities = ["read"]
        }

        path "kv/metadata/crossplane/*" {
          capabilities = ["read", "list"]
        }

        path "kv/data/shared/*" {
          capabilities = ["read"]
        }

        path "kv/metadata/shared/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing Backstage policy..."

        bao policy write backstage-policy - <<'EOF'
        path "kv/data/backstage/*" {
          capabilities = ["read"]
        }

        path "kv/metadata/backstage/*" {
          capabilities = ["read", "list"]
        }
        EOF

        echo "Writing ArgoCD ESO policy..."

        bao policy write eso-argocd-policy - <<EOF
        path "kv/metadata/argocd/*" {
          capabilities = ["read", "list"]
        }

        path "kv/data/argocd/*" {
          capabilities = ["read"]
        }
        EOF

        ########################################
        # 4d. Root admin policy for crossplane provider-vault
        #
        # provider-vault authenticates at the root namespace (via its vault-agent
        # sidecar → jwt-management/provider-vault role, configured by
        # setup-openbao.sh) and manages ONLY the per-tenant human-OIDC plane: the
        # Identity Group/Alias that map a human's Entra `roles` claim to the
        # tenant, the per-tenant OIDC ACL policy, and a browsable placeholder
        # secret under the tenant's path.
        #
        # The MACHINE plane needs no per-tenant provisioning: tenant ESO logs in
        # through the shared jwt-development-tenants backend + shared `tenant` role
        # and is self-scoped to kv-development/data/<tenant>/* by the identity-
        # templated tenant-policy. There are no per-tenant namespaces, mounts, or
        # JWT roles to create, so those grants are gone.
        ########################################

        echo "Writing openbao-admin-policy (root)..."

        bao policy write openbao-admin-policy - <<'EOF'
        # Write the per-tenant placeholder secret + browse it back. Scoped to the
        # development tenant KV mount where tenant data lives.
        path "kv-development/data/*" {
          capabilities = ["create", "read", "update", "delete"]
        }
        path "kv-development/metadata/*" {
          capabilities = ["read", "list", "delete"]
        }

        # Per-tenant human-operator OIDC ACL policies (oidc-<tenant>) managed by
        # provider-vault from the tenant-management chart (central OpenBao OIDC SSO).
        path "sys/policies/acl/oidc-*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }

        # Per-tenant external Identity Groups + Group Aliases that map the Entra ID
        # `roles` claim to the tenant's OIDC policy (central root OIDC SSO).
        path "identity/group" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "identity/group/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "identity/group-alias" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "identity/group-alias/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
        }
        path "identity/lookup/group" {
          capabilities = ["update"]
        }

        # provider-vault (terraform-plugin-based) issues itself a short-lived
        # "limited child token" at setup time via auth/token/create. The child
        # token is ephemeral and can only inherit a subset of this policy.
        path "auth/token/create" {
          capabilities = ["update"]
        }
        EOF

        echo "=== OpenBao bootstrap complete ==="
