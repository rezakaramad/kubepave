# API service — ClusterIP only, used by external-dns inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: powerdns-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: powerdns
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: powerdns
  ports:
    - name: api
      port: 8081
      targetPort: 8081
      protocol: TCP
