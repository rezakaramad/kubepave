{{- if .Values.vault.enabled }}
{{- $tenant := .Values.tenant }}

# Per-tenant JWT auth role on the ROOT OpenBao namespace's jwt-development-tenants
# backend.
#
# Created by crossplane provider-vault (which runs on the management cluster).
# The role validates a ServiceAccount token minted in the tenant's WORKLOAD
# namespace and attaches the shared, identity-templated tenant-policy. The role
# lives at the ROOT namespace (no forProvider.namespace): tenant ESO authenticates
# here and uses the resulting token against its own child data namespace.
#
# Isolation: userClaim is the namespace JSON pointer, so the OpenBao entity alias
# resolves to the bare workload namespace name (== tenant name). tenant-policy
# then expands {{`{{identity.entity.aliases[<accessor>].name}}`}} to that name,
# giving the tenant access to only tenants/<tenant>/kv/* — a hard, per-tenant
# boundary derived from a cryptographically signed claim that a tenant cannot
# forge.
#
# boundSubject additionally restricts which ServiceAccount may assume the role.
apiVersion: jwt.vault.m.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: {{ $tenant.name | lower | quote }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.vault.providerConfigName | quote }}

  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    backend: {{ .Values.vault.authBackend | quote }}
    roleName: {{ $tenant.name | lower | quote }}
    roleType: jwt
    boundAudiences:
      - {{ .Values.vault.audience | quote }}
    boundSubject: {{ printf "system:serviceaccount:%s:%s" ($tenant.name | lower) .Values.vault.serviceAccountName | quote }}
    # Namespace JSON pointer → entity alias == namespace == tenant name.
    userClaim: /kubernetes.io/namespace
    userClaimJsonPointer: true
    tokenPolicies:
      - {{ .Values.vault.policy | quote }}
    tokenTtl: {{ .Values.vault.tokenTtl }}

---
{{- end }}
