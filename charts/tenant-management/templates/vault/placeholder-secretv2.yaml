{{- if .Values.vault.enabled }}
{{- $tenant := .Values.tenant }}
{{- $ns := printf "%s/%s" .Values.vault.parentNamespace ($tenant.name | lower) }}

# Placeholder secret that materializes the tenant's KV path on provisioning.
#
# A KV v2 path does not exist until something is written to it. Without this,
# a tenant operator logging into their namespace for the first time lands on an
# empty/missing path and sees nothing. Writing one harmless secret creates
# tenants/<tenant>/kv/welcome so the path is browsable from day one.
#
# Written by provider-vault in the child namespace context
# (forProvider.namespace: tenants/<tenant>) into the `kv` mount. Crossplane
# retries until the Mount above exists.
#
# The data is write-only (dataJsonWo) so provider-vault never reads it back;
# combined with dataJsonWoVersion it is written once and not reconciled on
# every loop, so a tenant editing or adding secrets under their path is never
# clobbered.
apiVersion: kv.vault.m.upbound.io/v1alpha1
kind: SecretV2
metadata:
  name: {{ printf "%s-vault-placeholder" ($tenant.name | lower) }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.vault.providerConfigName | quote }}

  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    namespace: {{ $ns | quote }}
    mount: {{ .Values.vault.kvMount | quote }}
    name: "welcome"
    dataJsonWo: |
      {"info":"Welcome to your tenant secret path. Create your secrets under tenants/{{ $tenant.name | lower }}/kv/."}
    dataJsonWoVersion: 1
{{- end }}

