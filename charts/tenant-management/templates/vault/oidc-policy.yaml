{{- if and .Values.vault.enabled .Values.vault.oidc.enabled }}
{{- $tenant := .Values.tenant }}

# Per-tenant Vault ACL Policy for HUMAN tenant operators logging in via Entra ID OIDC
# Grants the tenant read/write on ONLY their own KV path

apiVersion: vault.vault.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: {{ printf "oidc-%s" ($tenant.name | lower) }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.vault.providerConfigName | quote }}

  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    name: {{ printf "oidc-%s" ($tenant.name | lower) | quote }}
    policy: |
      # Vault UI first lists tenants/metadata when opening the tenants/ KV mount.
      # Grant list on the mount root so the UI can render.
      # Trade-off: users may see other tenant folder names, but cannot read
      # their data or metadata. Access below remains scoped to this tenant.
      path "tenants/metadata" {
        capabilities = ["list"]
      }
      path "tenants/data/{{ $tenant.name | lower }}/*" {
        capabilities = ["read", "list", "create", "update", "delete"]
      }
      path "tenants/metadata/{{ $tenant.name | lower }}/*" {
        capabilities = ["read", "list", "delete"]
      }
{{- end }}
