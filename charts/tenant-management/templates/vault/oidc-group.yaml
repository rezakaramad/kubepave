{{- if and .Values.vault.enabled .Values.vault.oidc.enabled }}
{{- $tenant := .Values.tenant }}

# Creates an OpenBao Identity Group per tenant, oidc-<tenant>.
# Marks it type: external, so membership is not manually listed here.
# Attaches the tenant policy (oidc-<tenant>) to that group.
# Lets GroupAlias decide who joins at login (based on OIDC roles claim).

apiVersion: identity.vault.m.upbound.io/v1alpha1
kind: Group
metadata:
  name: {{ printf "oidc-%s" ($tenant.name | lower) }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.vault.providerConfigName | quote }}

  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    name: {{ printf "oidc-%s" ($tenant.name | lower) | quote }}
    type: external
    policies:
      -  {{ printf "oidc-%s" ($tenant.name | lower) | quote }}
{{- end }}
