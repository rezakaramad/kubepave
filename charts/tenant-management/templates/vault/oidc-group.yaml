{{- if and .Values.vault.enabled .Values.vault.oidc.enabled }}
{{- $tenant := .Values.tenant }}

# External Vault Identity Group for the tenant. `type: external` means membership
# is NOT set here — it is resolved at login time via the group alias
# (oidc-group-alias.yaml) matching the Entra ID `roles` claim. The group attaches
# the per-tenant ACL policy (oidc-policy.yaml), so any human whose token carries
# the tenant's app-role value inherits exactly that tenant's access and nothing
# more.
apiVersion: identity.vault.m.upbound.io/v1alpha1
kind: Group
metadata:
  name: {{ printf "%s-vault-group" ($tenant.name | lower) }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ .Values.vault.providerConfigName | quote }}

  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    name: {{ printf "vault-tenant-%s" ($tenant.name | lower) | quote }}
    type: external
    policies:
      - {{ printf "tenant-%s" ($tenant.name | lower) | quote }}
{{- end }}
