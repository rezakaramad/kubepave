# The tenant's platform charts are deployed by the xtenantargo Crossplane
# function. This cluster-scoped XTenantArgo composite resource drives a
# two-generator ApplicationSet (a list generator for the management-cluster app
# and a clusters generator for the per-environment workload-cluster apps). The
# ApplicationSet itself is composed into the argocd namespace.
{{- $tenant := .Values.tenant }}

apiVersion: idp.rezakara.demo/v1beta1
kind: XTenantArgo
metadata:
  name: {{ $tenant.name }}
  labels:
    {{- include "tpr.labels" . | nindent 4 }}
    platform.rezakara.demo/tenant: "{{ $tenant.name | lower }}"
spec: {}

---
