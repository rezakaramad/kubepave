configConnector:
  enabled: false

vault:
  enabled: false
  # provider-vault ClusterProviderConfig name (defined in the crossplane chart).
  # The provider authenticates at the ROOT namespace with openbao-admin-policy
  # and writes the tenant's placeholder secret under its own path prefix.
  providerConfigName: vault
  # Shared per-cluster KV v2 mount (at the ROOT namespace) that holds every
  # development tenant's secrets. Each tenant owns the path prefix
  # <kvMount>/data/<tenant>/*. A placeholder secret is written under
  # <kvMount>/data/<tenant>/welcome so the path exists on first login.
  kvMount: kv-development

  # Human tenant-operator SSO into OpenBao via Entra ID OIDC. When enabled, the
  # chart provisions a per-tenant ACL Policy + external Identity Group + Group
  # Alias so a user whose Entra ID token carries this tenant's app-role value
  # (the `roles` claim) can log into OpenBao and access ONLY
  # <kvMount>/data/<tenant>/*. The Policy, Group and GroupAlias live in the ROOT
  # namespace (where the central OIDC method is mounted).
  oidc:
    enabled: false
    # Mount accessor of the `oidc` auth method on the management OpenBao. Captured
    # by setup-openbao.sh (OPENBAO_OIDC_ACCESSOR) and injected via the crossplane
    # composition. Required when oidc.enabled is true.
    mountAccessor: ""

grafana:
  enabled: false

harbor:
  enabled: false

gcp-artifact-registry:
  enabled: false

argocd:
  clusters:
    - clusterName: kind-development
      environment: development
      environmentPrefix: dev
      tenantAppProject:
        policies:
          - resource: applications
            actions:
              - get
              - update
              - delete
              - sync
              - action/apps/Deployment/pause
              - action/apps/Deployment/resume
              - action/apps/Deployment/restart
              - action/batch/CronJob/create-job
          - resource: logs
            actions:
              - get
