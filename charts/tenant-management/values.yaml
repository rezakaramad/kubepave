configConnector:
  enabled: false

vault:
  enabled: false
  # JWT auth backend on the management Vault that validates workload-cluster
  # tenant ServiceAccount tokens. Created by setup-vault.sh (configure_tenant_jwt).
  authBackend: jwt-workload-tenants
  # Shared identity-templated policy scoping each tenant to tenants/<tenant>/*.
  policy: tenant-policy
  # ServiceAccount (in the tenant's workload namespace) allowed to assume the role.
  # Must match the ServiceAccount created by the tenant-workload chart.
  serviceAccountName: tenant-secrets
  # Audience the workload SA token is minted with (must match the projected token
  # audience requested by the consumer, e.g. the tenant SecretStore).
  audience: https://kubernetes.default.svc.cluster.local
  # provider-vault ClusterProviderConfig name (defined in the crossplane chart).
  providerConfigName: vault
  # TTL (seconds) for tokens issued under this role.
  tokenTtl: 3600

grafana:
  enabled: false

harbor:
  enabled: false

gcp-artifact-registry:
  enabled: false
