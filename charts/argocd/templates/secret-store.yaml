{{- if and .Values.secretStore.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1") }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    {{- toYaml .Values.secretStore.provider | nindent 4 }}

---
{{- end }}
