{{- if .Values.azureIdentity.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: argocd-azure-identity
  namespace: argocd
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-local
    kind: SecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.azure.clientSecret
      remoteRef:
        key: argocd/azure/apps/argocd
        property: client_secret
{{- end }}
