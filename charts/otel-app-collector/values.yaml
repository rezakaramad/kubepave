# Only the cluster that exports through the gateway turns this on.
gatewayAuth:
  enabled: false

otelCollector:
  mode: deployment
  # The tenant NetworkPolicy allows ingress from pods labelled app.kubernetes.io/name=app-collector.
  nameOverride: app-collector
  fullnameOverride: app-collector

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  # Adds k8s.* attributes (pod, namespace, deployment) to everything that passes through.
  presets:
    kubernetesAttributes:
      enabled: true

  ports:
    otlp:
      enabled: true
    otlp-http:
      enabled: true
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # The kubelet rotates this token; the gateway only accepts the audience otel-gateway.
  # Lists are replaced, not merged, so values-local-development.yaml repeats this volume.
  extraVolumes:
    - name: gateway-token
      projected:
        sources:
          - serviceAccountToken:
              audience: otel-gateway
              expirationSeconds: 3600
              path: token
  extraVolumeMounts:
    - name: gateway-token
      mountPath: /var/run/secrets/otel-gateway
      readOnly: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Used instead of `config` because Helm can't remove the chart's default jaeger/zipkin receivers.
  # Preset components (k8s_attributes) are still injected into this config.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      bearertokenauth/gateway:
        filename: /var/run/secrets/otel-gateway/token

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 10s
      # An app can send any tenant.id, so it is removed before the trusted value is added.
      transform/clear_tenant:
        error_mode: ignore
        trace_statements:
          - delete_key(resource.attributes, "tenant.id")
        metric_statements:
          - delete_key(resource.attributes, "tenant.id")
        log_statements:
          - delete_key(resource.attributes, "tenant.id")
      # Overrides the preset: only the connection identifies the pod, so apps cannot claim another pod
      # through k8s.pod.ip or k8s.pod.uid attributes. The tenant comes from the namespace label.
      k8sattributes:
        pod_association:
          - sources:
              - from: connection
        extract:
          labels:
            - tag_name: tenant.id
              key: platform.rezakara.demo/tenant
              from: namespace

    exporters:
      # Telemetry goes through the tenant-aware gateway; the endpoint is set per cluster.
      otlphttp/gateway:
        auth:
          authenticator: bearertokenauth/gateway

    service:
      extensions:
        - health_check
        - bearertokenauth/gateway
      # Internal metrics go to meta-collector, so this collector never monitors itself through itself.
      telemetry:
        resource:
          service.name: app-collector
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 60000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://meta-collector.observability.svc:4318/v1/metrics
      # k8sattributes is listed explicitly so the preset does not move it ahead of clear_tenant.
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/clear_tenant, k8sattributes, resource/cluster, batch]
          exporters: [otlphttp/gateway]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/clear_tenant, k8sattributes, resource/cluster, batch]
          exporters: [otlphttp/gateway]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/clear_tenant, k8sattributes, resource/cluster, batch]
          exporters: [otlphttp/gateway]
