# Tells Traefik to use TLS when connecting to the "kubernetes" backend and to
# verify the server cert against the cluster CA. Lives in the "default" namespace
# because a BackendTLSPolicy must be co-located with the Service it targets.
# "kube-root-ca.crt" is a ConfigMap Kubernetes automatically creates in every namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: kubernetes-api-tls
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: kubernetes
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
    hostname: kubernetes.default.svc.cluster.local
