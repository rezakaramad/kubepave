# Routes the two OIDC discovery paths to the cluster's own API server.
#
# The backend is the built-in "kubernetes" Service in the default namespace — a
# real ClusterIP with endpoints to the API server that exists on every cluster.
# We reference it cross-namespace (allowed by the ReferenceGrant in default).
#
# Traefik does NOT support ExternalName Services as HTTPRoute backends, which is
# why we target the real kubernetes Service rather than a DNS alias.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    external-dns-create: "true"
  name: oidc-proxy
  namespace: platform-system
spec:
  hostnames:
    - {{ .Values.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default-traefik
      namespace: platform-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/openid-configuration
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes
          namespace: default
          port: 443
    - matches:
        - path:
            type: PathPrefix
            value: /openid/v1/jwks
      backendRefs:
        - group: ""
          kind: Service
          name: kubernetes
          namespace: default
          port: 443
