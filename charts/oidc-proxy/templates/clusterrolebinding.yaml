# Grants anonymous (unauthenticated) callers read access to the OIDC discovery
# endpoints (/.well-known/openid-configuration and /openid/v1/jwks).
#
# Requests coming through Traefik carry no credentials, so the API server treats
# them as system:unauthenticated. By default Kubernetes only exposes these
# endpoints to authenticated service accounts, so without this binding the proxy
# would return 403. Vault needs anonymous access to fetch the JWKS at config time.
#
# The system:service-account-issuer-discovery ClusterRole is built into every
# cluster and only grants GET on the two discovery paths — nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-proxy-anonymous-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
