{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: openbao-local
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password
---
# Entra ID app registration (kv/grafana/azure/app), rendered into the env vars Grafana's azuread login reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: openbao-local
    kind: SecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    template:
      data:
        GF_AUTH_AZUREAD_CLIENT_ID: "{{`{{ .client_id }}`}}"
        GF_AUTH_AZUREAD_CLIENT_SECRET: "{{`{{ .client_secret }}`}}"
        GF_AUTH_AZUREAD_AUTH_URL: "https://login.microsoftonline.com/{{`{{ .tenant_id }}`}}/oauth2/v2.0/authorize"
        GF_AUTH_AZUREAD_TOKEN_URL: "https://login.microsoftonline.com/{{`{{ .tenant_id }}`}}/oauth2/v2.0/token"
        GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS: "{{`{{ .tenant_id }}`}}"
  data:
    - secretKey: client_id
      remoteRef:
        key: grafana/azure/app
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: grafana/azure/app
        property: client_secret
    - secretKey: tenant_id
      remoteRef:
        key: grafana/azure/app
        property: tenant_id
{{- end }}
