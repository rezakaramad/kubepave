kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  podSubnet: "10.245.0.0/16"
  serviceSubnet: "10.102.0.0/16"
  disableDefaultCNI: false

nodes:
  - role: control-plane
    extraPortMappings: []
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
