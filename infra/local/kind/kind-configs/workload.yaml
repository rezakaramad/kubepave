kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  podSubnet: "192.168.102.0/24"
  serviceSubnet: "192.168.103.0/24"
  # Disable the default kindnet CNI — Cilium is installed as the CNI + LB instead.
  disableDefaultCNI: true
  # Disable kube-proxy — Cilium runs in kube-proxy-replacement mode, which is
  # required for its L2 LoadBalancer announcements to program the service datapath.
  kubeProxyMode: "none"

nodes:
  - role: control-plane
    extraPortMappings: []
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
