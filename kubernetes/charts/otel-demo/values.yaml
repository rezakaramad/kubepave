route:
  hostname: shop.dev.rezakara.demo

opentelemetry-demo:
  # The platform LGTM stack and collectors replace the demo's bundled observability backends.
  opentelemetry-collector:
    enabled: false
  jaeger:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  opensearch:
    enabled: false

  default:
    envOverrides:
      # Every demo service builds its OTLP endpoint from this name.
      - name: OTEL_COLLECTOR_NAME
        value: app-collector.observability.svc.cluster.local
    # Pod Security Standards "restricted". The upstream chart uses a component's own securityContext
    # instead of the default one, so every component that sets one is extended below.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

  components:
    # Components that already define a securityContext in the upstream chart.
    checkout:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      initContainers:
        - name: wait-for-kafka
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    frontend:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    frontend-proxy:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    payment:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    product-catalog:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      initContainers:
        - name: wait-for-astronomy-db
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    quote:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    shipping:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      initContainers:
        - name: wait-for-flagd
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    kafka:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    valkey-cart:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    telemetry-docs:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

    # Images that only work as their own user (not the default 65534).
    image-provider:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 101  # owns /etc/nginx, which the entrypoint rewrites
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    load-generator:
      envOverrides:
        - name: HOME  # Chromium crashpad needs a writable home
          value: /tmp

    # Components that only define initContainers upstream (lists are replaced, not merged).
    accounting:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1654  # "app" user, the only one allowed to exec ./instrument.sh
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-kafka
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    cart:
      initContainers:
        - name: wait-for-valkey-cart
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    fraud-detection:
      initContainers:
        - name: wait-for-kafka
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
    flagd:
      initContainers:
        - name: init-config
          image: busybox
          command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /config-ro
              name: config-ro
            - mountPath: /config-rw
              name: config-rw
