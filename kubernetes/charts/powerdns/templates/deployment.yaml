apiVersion: apps/v1
kind: Deployment
metadata:
  name: powerdns
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: powerdns
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: powerdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powerdns
    spec:
      # hostNetwork binds PowerDNS directly to the node container's network interface.
      # This makes port 53 reachable at <node-docker-bridge-ip>:53 from:
      #   - pods in both clusters (via CNI → node → Docker bridge)
      #   - the host (via Docker bridge)
      # The node container has its own network namespace — this does NOT
      # affect the host's port 53 or systemd-resolved.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Waits for Postgres to be ready, applies the gpgsql schema, and seeds
        # initial zones — all idempotent. Runs on every pod restart which is
        # safe because of IF NOT EXISTS / ON CONFLICT DO NOTHING.
        - name: schema-init
          image: postgres:17
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
          command:
            - sh
            - -c
            - |
              set -e

              echo "Waiting for Postgres..."
              until pg_isready -h {{ .Values.postgres.host }} -U {{ .Values.postgres.user }}; do
                sleep 2
              done

              echo "Applying schema..."
              psql -h {{ .Values.postgres.host }} \
                   -U {{ .Values.postgres.user }} \
                   -d {{ .Values.postgres.database }} <<'SCHEMA'
              CREATE TABLE IF NOT EXISTS domains (
                id                    SERIAL PRIMARY KEY,
                name                  VARCHAR(255) NOT NULL,
                master                VARCHAR(128) DEFAULT NULL,
                last_check            INT DEFAULT NULL,
                type                  VARCHAR(8) NOT NULL,
                notified_serial       BIGINT DEFAULT NULL,
                account               VARCHAR(40) DEFAULT NULL,
                options               VARCHAR(65535) DEFAULT NULL,
                catalog               VARCHAR(255) DEFAULT NULL
              );
              CREATE UNIQUE INDEX IF NOT EXISTS name_index ON domains(name);

              CREATE TABLE IF NOT EXISTS records (
                id                    BIGSERIAL PRIMARY KEY,
                domain_id             INT DEFAULT NULL,
                name                  VARCHAR(255) DEFAULT NULL,
                type                  VARCHAR(10) DEFAULT NULL,
                content               VARCHAR(65535) DEFAULT NULL,
                ttl                   INT DEFAULT NULL,
                prio                  INT DEFAULT NULL,
                disabled              BOOL DEFAULT 'f',
                ordername             VARCHAR(255),
                auth                  BOOL DEFAULT 't'
              );
              CREATE INDEX IF NOT EXISTS rec_name_index ON records(name);
              CREATE INDEX IF NOT EXISTS nametype_index ON records(name,type);
              CREATE INDEX IF NOT EXISTS domain_id ON records(domain_id);
              CREATE INDEX IF NOT EXISTS recordorder ON records(domain_id, ordername text_pattern_ops);

              CREATE TABLE IF NOT EXISTS supermasters (
                ip                    INET NOT NULL,
                nameserver            VARCHAR(255) NOT NULL,
                account               VARCHAR(40) NOT NULL,
                PRIMARY KEY(ip, nameserver)
              );

              CREATE TABLE IF NOT EXISTS comments (
                id                    SERIAL PRIMARY KEY,
                domain_id             INT NOT NULL,
                name                  VARCHAR(255) NOT NULL,
                type                  VARCHAR(10) NOT NULL,
                modified_at           INT NOT NULL,
                account               VARCHAR(40) DEFAULT NULL,
                comment               VARCHAR(65535) NOT NULL
              );
              CREATE INDEX IF NOT EXISTS comments_name_type_idx ON comments(name, type);
              CREATE INDEX IF NOT EXISTS comments_order_idx ON comments(domain_id, modified_at);

              CREATE TABLE IF NOT EXISTS domainmetadata (
                id                    SERIAL PRIMARY KEY,
                domain_id             INT REFERENCES domains(id) ON DELETE CASCADE,
                kind                  VARCHAR(32),
                content               TEXT
              );
              CREATE INDEX IF NOT EXISTS domainidmetaindex ON domainmetadata(domain_id);

              CREATE TABLE IF NOT EXISTS cryptokeys (
                id                    SERIAL PRIMARY KEY,
                domain_id             INT REFERENCES domains(id) ON DELETE CASCADE,
                flags                 INT NOT NULL,
                active                BOOL,
                published             BOOL DEFAULT TRUE,
                content               TEXT
              );
              CREATE INDEX IF NOT EXISTS domainidindex ON cryptokeys(domain_id);

              CREATE TABLE IF NOT EXISTS tsigkeys (
                id                    SERIAL PRIMARY KEY,
                name                  VARCHAR(255),
                algorithm             VARCHAR(50),
                secret                VARCHAR(255),
                CONSTRAINT c_lowercase_name CHECK (name = lower(name))
              );
              CREATE UNIQUE INDEX IF NOT EXISTS namealgoindex ON tsigkeys(name, algorithm);
              SCHEMA

              echo "Seeding zones..."
              psql -h {{ .Values.postgres.host }} \
                   -U {{ .Values.postgres.user }} \
                   -d {{ .Values.postgres.database }} <<'SQL'
              INSERT INTO domains (name, type)
              VALUES
                ('rezakara.demo',      'NATIVE'),
                ('mgmt.rezakara.demo', 'NATIVE'),
                ('dev.rezakara.demo',   'NATIVE')
              ON CONFLICT (name) DO NOTHING;

              INSERT INTO records (domain_id, name, type, content, ttl)
              SELECT id, name, 'SOA',
                     'ns1.rezakara.demo. admin.rezakara.demo. 1 10800 3600 604800 3600',
                     3600
              FROM domains
              WHERE name IN ('rezakara.demo', 'mgmt.rezakara.demo', 'dev.rezakara.demo')
              ON CONFLICT DO NOTHING;

              INSERT INTO records (domain_id, name, type, content, ttl)
              SELECT id, name, 'NS', 'ns1.rezakara.demo.', 3600
              FROM domains
              WHERE name IN ('rezakara.demo', 'mgmt.rezakara.demo', 'dev.rezakara.demo')
              ON CONFLICT DO NOTHING;
              SQL

              echo "Done"
      containers:
        - name: powerdns
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config-dir=/dev/null
            - --launch=gpgsql
            - --gpgsql-host={{ .Values.postgres.host }}
            - --gpgsql-port={{ .Values.postgres.port | toString }}
            - --gpgsql-user={{ .Values.postgres.user }}
            - --gpgsql-dbname={{ .Values.postgres.database }}
            - --gpgsql-password=$(POSTGRES_PASSWORD)
            - --api=yes
            - --api-key=$(PDNS_API_KEY)
            - --webserver=yes
            - --webserver-address=0.0.0.0
            - --webserver-port=8081
            - --webserver-allow-from=0.0.0.0/0
            - --local-address=0.0.0.0
            - --local-port=53
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: api
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          resources: {{ toYaml .Values.resources | nindent 12 }}
