{{- if .Values.compositeResources.xTenant.enabled }}

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xtenant
spec:
  compositeTypeRef:
    apiVersion: idp.rezakara.demo/v1beta1
    kind: XTenant
  mode: Pipeline
  pipeline:
    - step: run-the-template
      functionRef:
        name: xtenant
      input:
        apiVersion: defaults.fn.crossplane.io/v1beta1
        kind: Input

        # The ArgoCD AppProject all generated Applications belong to.
        project: tenant-system

        # The label key set on every generated resource, with the tenant name as its value.
        tenantLabelKey: platform.rezakara.demo/tenant

        # The Application that deploys the tenant's Entra ID SSO resources to the management cluster.
        sso:
          repoURL: https://github.com/rezakaramad/kubepave
          path: kubernetes/charts/tenant-sso
          targetRevision: HEAD
          targetNamespace: tenant-system

        # The Application that deploys the tenant's management resources to the management cluster.
        management:
          repoURL: https://github.com/rezakaramad/kubepave
          path: kubernetes/charts/tenant-management
          targetRevision: HEAD
          targetNamespace: tenant-system
          helm:
            parameters:
              - name: vault.enabled
                value: "true"
              {{- if .Values.vaultProvider.oidcAccessor }}
              # Human tenant-operator Vault SSO: enabled only once the OIDC mount
              # accessor has been pasted into vaultProvider.oidcAccessor. Provisions
              # the per-tenant Policy/Group/GroupAlias in the tenant-management chart.
              - name: vault.oidc.enabled
                value: "true"
              - name: vault.oidc.mountAccessor
                value: {{ .Values.vaultProvider.oidcAccessor | quote }}
              {{- end }}

        # The ApplicationSet that deploys the tenant's workload resources to the workload clusters.
        workload:
          repoURL: https://github.com/rezakaramad/kubepave
          path: kubernetes/charts/tenant-workload
          targetRevision: HEAD
          helm:
            valueFiles:
              - values-local.yaml
              - 'values-local-{{ `{{ index .metadata.labels "argocd.rezakara.demo/environment" }}` }}.yaml'
            parameters:
              - name: vault.enabled
                value: "true"
          targetClusters:
            clusterTypeKey: argocd.rezakara.demo/cluster-type
            clusterType: tenant
            environmentKey: argocd.rezakara.demo/environment
            environments:
              - development
              - test
              - production

        # The namespace the Applications and the ApplicationSet are created in.
        namespace:
          argo: argocd

---
{{- end }}
