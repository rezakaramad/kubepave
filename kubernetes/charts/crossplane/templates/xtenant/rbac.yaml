{{- if .Values.compositeResources.xTenant.enabled }}

# Lets Crossplane manage the Argo CD Applications and ApplicationSets the xtenant function composes.
# This must be a ClusterRole (not a namespaced Role): Crossplane's composite controller starts a
# cluster-scoped informer to observe composed resources, so it lists and watches across all namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-xtenant-argocd-manager
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applications/status", "applicationsets", "applicationsets/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-xtenant-argocd-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-xtenant-argocd-manager
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system

---
{{- end }}
