{{- if and .Values.vaultProvider.enabled (.Capabilities.APIVersions.Has "pkg.crossplane.io/v1/Provider") }}

# We create a cluster-scoped ProviderConfig because there is no point in creating a namespaced one 
# A namespaced ProviderConfig would only improve security if each namespace held differently-scoped credentials.
# In this setup every ProviderConfig would be identical, same address, same source: Filesystem, same token path; 
# because there is one Vault Agent writing one token from one identity.
# Splitting it across namespaces gives N identical copies with zero additional isolation; the actual tenant boundary
# is enforced by the Vault tenant-policy identity template at login time, which has nothing to do with 
# where the ProviderConfig object lives.

# provider-vault cannot use its own pod identity to authenticate to Vault:
# source: InjectedIdentity is not implemented (upbound/provider-vault#5). Verified at v4.0.0;
# an MR referencing such a config fails with:
#   "cannot extract credentials: no extraction handler registered for source: InjectedIdentity"

# Kubernetes auth (source: Kubernetes) was considered but rejected: it uses the
# Vault Kubernetes auth method, which calls back to the Kubernetes API server via
# TokenReview on every login. This requires Vault to hold a reviewer credential
# and reach the API server; an extra permission and an extra runtime dependency.
# JWT auth validates tokens locally using the cluster's JWKS public keys, with no
# API callback and no reviewer credential stored in Vault.


# Unlike ESO and the other platform components, which exchange their ServiceAccount
# JWT for a short-lived Vault token via the jwt-management auth backend, the
# provider-vault controller cannot use its own pod identity because the provider
# does not support InjectedIdentity. 

# Instead, we inject a Vault Agent sidecar into the provider pod (see runtime-config.yaml)
# that authenticates to Vault via the provider-vault ServiceAccount JWT and writes a short-lived Vault token to
# a shared in-memory volume. The provider reads that token each reconcile. No static secret and no TokenReview call-back.

# provider-vault can only read a pre-issued token
# from a Secret, env var, or file (source: Filesystem). A Vault Agent sidecar (see
# runtime-config.yaml) bridges the gap: it performs the JWT login to jwt-management
# with the provider-vault ServiceAccount JWT, obtains a short-lived Vault token, and
# writes it to a shared in-memory volume at /vault/secrets/token. This provider reads
# that file each reconcile. No static secret and no TokenReview call-back.


# The Vault Terraform provider issues itself a short-lived "limited child token"
# for safer access. skip_child_token=true is meant to disable this so the provider
# uses the agent-supplied token directly. NOTE: provider-vault v4.0.0 does not honor
# skip_child_token — it always calls auth/token/create — so provider-vault-policy
# grants "update" on auth/token/create. The child token is ephemeral and can only
# inherit a subset of the policy, so this adds no privilege escalation. We keep
# skip_child_token=true anyway for when a fixed provider honors it.
apiVersion: vault.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  address: {{ .Values.vaultProvider.address | quote }}
  skip_child_token: true
  credentials:
    source: Filesystem
    fs:
      path: /vault/secrets/token

{{- end }}
