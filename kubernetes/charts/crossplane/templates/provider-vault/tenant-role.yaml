{{- if and .Values.vaultProvider.enabled .Values.vaultProvider.tenantAccessor }}
{{- $accessor := .Values.vaultProvider.tenantAccessor }}
{{- $mount := .Values.vaultProvider.tenantKvMount }}
# The identity template resolves the tenant segment from the caller's alias name, so a
# token minted for tenant <t> only reaches <mount>/data/<t>/* and <mount>/metadata/<t>/*.
# No list/read at the mount root, so tenants cannot enumerate each other's prefixes.
apiVersion: vault.vault.m.upbound.io/v1alpha1
kind: Policy
metadata:
  name: tenant-policy
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: vault
  managementPolicies: ["Create", "Observe", "Update", "Delete"]
  forProvider:
    name: tenant-policy
    policy: |
      {{ printf `path "%s/data/{{identity.entity.aliases[%s].name}}/*" {` $mount $accessor }}
        capabilities = ["read", "list", "create", "update", "delete"]
      }
      {{ printf `path "%s/metadata/{{identity.entity.aliases[%s].name}}/*" {` $mount $accessor }}
        capabilities = ["read", "list", "delete"]
      }
---
# Single shared role. user_claim is the namespace JSON pointer, so each tenant pod's
# alias == its namespace == its tenant name. No bound_subject: any development-cluster
# SA with a valid, audience-bound token is scoped to its own namespace path only.
apiVersion: jwt.vault.m.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: tenant
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: vault
  managementPolicies: ["Create", "Observe", "Update", "Delete"]
  forProvider:
    backend: {{ .Values.vaultProvider.tenantJwtBackend | quote }}
    roleName: tenant
    roleType: jwt
    boundAudiences:
      - https://kubernetes.default.svc.cluster.local
    userClaim: /kubernetes.io/namespace
    userClaimJsonPointer: true
    tokenPolicies:
      - tenant-policy
    tokenTtl: 3600
{{- end }}
