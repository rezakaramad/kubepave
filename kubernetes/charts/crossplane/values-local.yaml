selfSignedRootCA:
  # Set to false if the cluster uses an external CA provider (e.g. cloud PKI, Let's Encrypt, etc.).
  enabled: true

secretStore:
  name: openbao-local
  provider:
    vault:
      caProvider:
        key: tls.crt
        name: root-ca
        namespace: crossplane-system
        type: Secret
      path: kv
      server: https://openbao.mgmt.rezakara.demo
      version: v2
      auth:
        jwt:
          path: <upsert-in-env-values-file>
          role: crossplane
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: crossplane
              namespace: crossplane-system
            audiences:
              - https://kubernetes.default.svc.cluster.local

compositeResources:
  xTenant:
    enabled: false
    package: ghcr.io/rezakaramad/function-xtenant
    packageTag: <upsert-in-env-values-file>
    # Alternative xtenant-gotemplating Composition, selected per XR via spec.crossplane.compositionRef.
    goTemplating:
      enabled: false
      # Revision channel this Composition is published to. To trial a template: set templateVersion to the new
      # version and channel to `next`; to promote, set channel back to `stable` (XRs follow it by label).
      channel: stable
      # Which xtenant-argocd-<version> EnvironmentConfig from the tenant-templates chart to render.
      templateVersion: v1
      package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
      packageTag: v0.13.2
      environmentConfigs:
        package: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
        packageTag: v0.9.2

  xTenantSSO:
    enabled: false
    package: ghcr.io/rezakaramad/function-xtenantsso
    packageTag: <upsert-in-env-values-file>

  xTenantArgo:
    enabled: false
    package: ghcr.io/rezakaramad/function-xtenantargo
    packageTag: <upsert-in-env-values-file>

  xWebApp:
    enabled: false
    package: ghcr.io/rezakaramad/function-xwebapp
    packageTag: <upsert-in-env-values-file>
