rootCA:
  enabled: true

clusterSecretStore:
  name: openbao-local
  provider:
    vault:
      server: "https://openbao.mgmt.rezakara.demo"
      path: "kv"
      version: "v2"
      caProvider:
        type: Secret
        name: root-ca
        key: ca.crt
        namespace: platform-system

secretStore:
  name: openbao-local
  provider:
    vault:
      server: "https://openbao.mgmt.rezakara.demo"
      path: "kv"
      version: "v2"
      caProvider:
        type: Secret
        name: root-ca
        key: ca.crt
        namespace: platform-system
