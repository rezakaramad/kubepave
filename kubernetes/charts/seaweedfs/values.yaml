seaweedfs:
  global:
    seaweedfs:
      serviceAccountName: seaweedfs

  # Single pod running master, volume, filer and S3 gateway
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 10Gi
    s3:
      enabled: true
      enableAuth: true
      # Rendered by ESO from OpenBao; the chart's own S3 Secret generates random keys on every render
      existingConfigSecret: seaweedfs-s3
      createBuckets:
        - name: loki-chunks
        - name: loki-ruler
        - name: tempo
        - name: mimir-blocks
        - name: mimir-ruler
        - name: mimir-alertmanager
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    extraArgs:
      - -s3.iam.config=/etc/sw/iam/iam.json
    extraVolumes: |
      - name: iam-config
        secret:
          secretName: seaweedfs-iam-config
    extraVolumeMounts: |
      - name: iam-config
        mountPath: /etc/sw/iam
        readOnly: true

  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  s3:
    enabled: false
