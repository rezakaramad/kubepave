# Lets Loki, Tempo and Mimir trade a Kubernetes ServiceAccount token for short-lived S3 credentials.
# This ConfigMap is only the template; ESO renders it into Secret seaweedfs-iam-config with the signing key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-iam-template
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
data:
  iam.json: |
    {
      "sts": {
        "tokenDuration": "1h",
        "maxSessionLength": "12h",
        "signingKey": "{{ "{{ .sts_signing_key }}" }}"
      },
      "providers": [
        {
          "name": "k8s",
          "type": "oidc",
          "enabled": true,
          "config": {
            "issuer": "https://kubernetes.default.svc.cluster.local",
            "clientId": "seaweedfs-s3",
            "jwksUri": "https://kubernetes.default.svc.cluster.local/openid/v1/jwks",
            "tlsCaCert": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }
        }
      ],
      "policies": [
        {
          "name": "LokiPolicy",
          "document": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:*"],
                "Resource": [
                  "arn:aws:s3:::loki-chunks", "arn:aws:s3:::loki-chunks/*",
                  "arn:aws:s3:::loki-ruler", "arn:aws:s3:::loki-ruler/*"
                ]
              }
            ]
          }
        },
        {
          "name": "TempoPolicy",
          "document": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:*"],
                "Resource": ["arn:aws:s3:::tempo", "arn:aws:s3:::tempo/*"]
              }
            ]
          }
        },
        {
          "name": "MimirPolicy",
          "document": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:*"],
                "Resource": [
                  "arn:aws:s3:::mimir-blocks", "arn:aws:s3:::mimir-blocks/*",
                  "arn:aws:s3:::mimir-ruler", "arn:aws:s3:::mimir-ruler/*",
                  "arn:aws:s3:::mimir-alertmanager", "arn:aws:s3:::mimir-alertmanager/*"
                ]
              }
            ]
          }
        }
      ],
      "roles": [
        {
          "roleName": "LokiRole",
          "roleArn": "arn:aws:iam::role/LokiRole",
          "attachedPolicies": ["LokiPolicy"],
          "trustPolicy": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "k8s" },
                "Action": ["sts:AssumeRoleWithWebIdentity"],
                "Condition": { "StringEquals": { "oidc:sub": "system:serviceaccount:observability:loki" } }
              }
            ]
          }
        },
        {
          "roleName": "TempoRole",
          "roleArn": "arn:aws:iam::role/TempoRole",
          "attachedPolicies": ["TempoPolicy"],
          "trustPolicy": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "k8s" },
                "Action": ["sts:AssumeRoleWithWebIdentity"],
                "Condition": { "StringEquals": { "oidc:sub": "system:serviceaccount:observability:tempo" } }
              }
            ]
          }
        },
        {
          "roleName": "MimirRole",
          "roleArn": "arn:aws:iam::role/MimirRole",
          "attachedPolicies": ["MimirPolicy"],
          "trustPolicy": {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Federated": "k8s" },
                "Action": ["sts:AssumeRoleWithWebIdentity"],
                "Condition": { "StringEquals": { "oidc:sub": "system:serviceaccount:observability:mimir" } }
              }
            ]
          }
        }
      ]
    }
{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-iam-config
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: openbao-local
    kind: SecretStore
  target:
    name: seaweedfs-iam-config
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: seaweedfs-iam-template
            items:
              - key: iam.json
  data:
    - secretKey: sts_signing_key
      remoteRef:
        key: seaweedfs/sts
        property: signing_key
{{- end }}
