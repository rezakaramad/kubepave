{{- $tenant := .Values.tenant }}
{{- $repoName := include "tenantDeployRepo.repoName" $tenant.name }}
{{- $githubOrg := include "tenantDeployRepo.githubOrg" $ }}

apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: {{ $repoName | quote }}
  annotations:
    crossplane.io/external-name: {{ $repoName | quote }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant.name | lower | quote }}
    platform.rezakara.demo/github-org: {{ $githubOrg | quote }}

spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: {{ printf "github-%s" $githubOrg | quote }}

  # "Delete" is for this local setup so removing the tenant also removes its repo; leave it out in production.
  managementPolicies: ["Create", "Observe", "Update", "Delete"]

  forProvider:
    name: {{ $repoName | quote }}
    description: "Tenant environment configuration managed via GitOps and continuously reconciled by Argo CD."
    visibility: private
    autoInit: true
    defaultBranch: main
    template:
      - owner: {{ $githubOrg | quote }}
        repository: platform-deploy-template

---
