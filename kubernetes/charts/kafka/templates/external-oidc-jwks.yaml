{{- if and .Values.cluster.enabled .Values.cluster.external.enabled }}
{{- $jwks := .Values.cluster.external.oauth.jwks }}

# The development cluster's public ServiceAccount signing keys, written to OpenBao by local/kind/setup-secrets.sh.
# The jwks-proxy serves them to the broker so it can verify development tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $jwks.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 20m
  secretStoreRef:
    name: {{ $jwks.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ $jwks.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: jwks.json
      remoteRef:
        key: {{ $jwks.remoteKey }}
        property: {{ $jwks.remoteProperty }}

---
{{- end }}
