{{- if and .Values.cluster.enabled .Values.cluster.external.enabled }}

# Server certificate for the external listener, signed by the platform root CA (ClusterIssuer).
# The Kafka resource reads it through brokerCertChainAndKey, so it must exist before Kafka is applied.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.cluster.name }}-external-listener
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: {{ .Values.cluster.external.certificate.secretName }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.cluster.external.certificate.issuerName }}
  # Strimzi requires an unencrypted PKCS#8 private key.
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 2048
  # Every name a client can connect to: the bootstrap address and each broker's address.
  dnsNames:
    - {{ include "kafka.externalBootstrapHost" . | quote }}
    {{- range $id := until (int .Values.cluster.broker.replicas) }}
    - {{ include "kafka.externalBrokerHost" (dict "root" $ "id" $id) | quote }}
    {{- end }}
  usages:
    - digital signature
    - key encipherment
    - server auth

---
{{- end }}
