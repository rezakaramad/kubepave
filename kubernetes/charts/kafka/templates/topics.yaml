{{- if .Values.cluster.enabled }}
{{- range .Values.cluster.topics }}

apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.cluster.name }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}

---
{{- end }}
{{- end }}
