{{- if .Values.cluster.jwksProxy.enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    events {}
    http {
      access_log /dev/stdout;
      error_log  /dev/stderr;
      server {
        listen 8080;
        location = /openid/v1/jwks {
          # Upstream: the cluster's OIDC JWKS endpoint on the kube API server.
          proxy_pass https://kubernetes.default.svc/openid/v1/jwks;

          # Set the Accept header to request the JWKS in the correct format.
          proxy_set_header Accept "application/jwk-set+json";

          # Verify the API server TLS using this pod's own mounted cluster CA.
          proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;

          # Enable verification of the API server's TLS certificate using the trusted CA.
          proxy_ssl_verify on;

          # Send SNI on the upstream TLS handshake so the API server presents the right cert.
          proxy_ssl_server_name on;

          # Name sent as SNI and verified against the API server cert's SAN.
          proxy_ssl_name kubernetes.default.svc;

          # Drop the upstream's application/jwk-set+json content type...
          proxy_hide_header Content-Type;

          # ...and return application/json so the OAuth client accepts the response.
          add_header Content-Type application/json always;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: jwks-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwks-proxy
  template:
    metadata:
      labels:
        app: jwks-proxy
    spec:
      containers:
        - name: nginx
          image: {{ .Values.cluster.jwksProxy.image }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: jwks-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: jwks-proxy
  ports:
    - port: 8080
      targetPort: 8080

{{- end }}
