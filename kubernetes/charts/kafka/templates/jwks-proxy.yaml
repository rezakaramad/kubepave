{{- if and .Values.cluster.jwksProxy.enabled .Values.cluster.external.enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    events {}
    http {
      access_log /dev/stdout;
      error_log  /dev/stderr;
      server {
        listen 8080;

        # The external listener's keys are served from the mounted file: the development cluster's
        # API server is not reachable with this pod's credentials.
        location = /external/openid/v1/jwks {
          alias /etc/nginx/jwks/jwks.json;
          default_type application/json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: jwks-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jwks-proxy
  template:
    metadata:
      labels:
        app: jwks-proxy
    spec:
      containers:
        - name: nginx
          image: {{ .Values.cluster.jwksProxy.image }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: external-jwks
              mountPath: /etc/nginx/jwks
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: jwks-proxy
        - name: external-jwks
          secret:
            secretName: {{ .Values.cluster.external.oauth.jwks.secretName }}
---
apiVersion: v1
kind: Service
metadata:
  name: jwks-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: jwks-proxy
  ports:
    - port: 8080
      targetPort: 8080

{{- end }}
