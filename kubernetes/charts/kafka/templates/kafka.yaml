{{- if .Values.cluster.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.cluster.version }}
    # metadataVersion is defaulted by the operator to match `version` when omitted.
    listeners:
      {{- toYaml .Values.cluster.listeners | nindent 6 }}
      {{- if .Values.cluster.external.enabled }}
      - name: external
        port: {{ .Values.cluster.external.port }}
        type: loadbalancer
        tls: true
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: OAUTHBEARER
            oauthbearer.sasl.server.callback.handler.class: io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
            # Same validation as the internal listener, but against the development cluster's issuer and keys.
            # Both clusters share one CA, so this pod's service account CA also trusts the development API server.
            oauthbearer.sasl.jaas.config: >-
              org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
              unsecuredLoginStringClaim_sub="kafka-broker"
              oauth.valid.issuer.uri="{{ .Values.cluster.external.oauth.validIssuerUri }}"
              oauth.jwks.endpoint.uri="{{ .Values.cluster.external.oauth.jwksEndpointUri }}"
              oauth.include.accept.header="false"
              oauth.ssl.truststore.location="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              oauth.ssl.truststore.type="PEM"
              oauth.fail.fast="false"
              oauth.username.claim="['kubernetes.io']['serviceaccount']['name']"
              oauth.check.audience="true"
              oauth.client.id="kafka"
              oauth.check.access.token.type="false" ;
        configuration:
          brokerCertChainAndKey:
            secretName: {{ .Values.cluster.external.certificate.secretName }}
            certificate: tls.crt
            key: tls.key
          bootstrap:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: {{ include "kafka.externalBootstrapHost" . | quote }}
          brokers:
            {{- range $id := until (int .Values.cluster.broker.replicas) }}
            - broker: {{ $id }}
              advertisedHost: {{ include "kafka.externalBrokerHost" (dict "root" $ "id" $id) | quote }}
              annotations:
                external-dns.alpha.kubernetes.io/hostname: {{ include "kafka.externalBrokerHost" (dict "root" $ "id" $id) | quote }}
            {{- end }}
      {{- end }}
    config:
      {{- toYaml .Values.cluster.config | nindent 6 }}
    {{- if .Values.cluster.authorization.enabled }}
    authorization:
      type: simple
      {{- with .Values.cluster.authorization.superUsers }}
      superUsers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
