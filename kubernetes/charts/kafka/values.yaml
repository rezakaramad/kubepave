# Kafka cluster provisioned by the bundled Strimzi operator (KRaft mode, no ZooKeeper).
# Operator settings live under the `strimzi-kafka-operator` key (the dependency subchart).
cluster:
  # Set to false to install the operator only, without a Kafka cluster.
  enabled: true
  name: kafka
  version: 4.3.1

  # A controller runs the KRaft metadata quorum that tracks cluster state.
  controller:
    replicas: 3
    storage:
      size: 10Gi
      deleteClaim: false

  # A broker stores topic partitions on disk and serves produce/consume traffic to clients.
  broker:
    replicas: 3
    storage:
      size: 10Gi
      deleteClaim: false

  # A listener is a network endpoint (port + protocol) that clients use to connect to brokers.
  # OAuth authentication: clients present a JWT and the broker validates it against the
  # Kubernetes API's OIDC/JWKS endpoint — i.e. a pod's ServiceAccount token is the credential.
  listeners:
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        # Strimzi 1.2.0 (API v1) removed the built-in `oauth` type. OAuth/OIDC is now wired
        # via `custom` authentication using Strimzi's bundled OAuth library.
        type: custom
        # Enable SASL on this (TLS) listener -> SASL_SSL.
        sasl: true
        listenerConfig:
          # Clients authenticate with an OAuth bearer token (a JWT).
          sasl.enabled.mechanisms: OAUTHBEARER
          # Server-side validator from Strimzi's OAuth library.
          oauthbearer.sasl.server.callback.handler.class: io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
          # Validate the JWT: pin the issuer, fetch signing keys from the K8s JWKS endpoint,
          # derive the principal from the SA *name* via JsonPath (so it is a valid KafkaUser name
          # for ACLs — the full `sub` has colons), and require the audience to contain "kafka".
          # The JWKS is fetched live from the apiserver. Kubernetes' /openid/v1/jwks returns 406 for
          # `Accept: application/json`, so oauth.include.accept.header=false drops that header and
          # the JVM's default wildcard Accept is accepted. The pod's own cluster CA verifies TLS.
          # oauth.validation.skip.type.check: K8s SA tokens carry no `typ` header/claim, which
          # the library otherwise requires; unsecuredLoginStringClaim_sub satisfies the broker's
          # own (unused) login on this client-facing listener.
          oauthbearer.sasl.jaas.config: >-
            org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
            unsecuredLoginStringClaim_sub="kafka-broker"
            oauth.valid.issuer.uri="https://kubernetes.default.svc.cluster.local"
            oauth.jwks.endpoint.uri="https://kubernetes.default.svc/openid/v1/jwks"
            oauth.include.accept.header="false"
            oauth.ssl.truststore.location="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            oauth.ssl.truststore.type="PEM"
            oauth.username.claim="['kubernetes.io']['serviceaccount']['name']"
            oauth.check.audience="true"
            oauth.client.id="kafka"
            oauth.validation.skip.type.check="true" ;

  # An extra listener that clients outside the cluster (the development cluster) connect to.
  # It is a LoadBalancer listener: one service for the bootstrap address and one per broker,
  # each published in DNS as <cluster>.<domain> and <cluster>-<broker id>.<domain>.
  external:
    enabled: true
    port: 9094
    domain: mgmt.rezakara.demo
    # The listener's TLS certificate is issued by cert-manager, so clients trust it through the
    # platform root CA instead of the Strimzi cluster CA.
    certificate:
      issuerName: local
      secretName: kafka-external-listener-tls
    # Clients here present development cluster ServiceAccount tokens. That cluster has its own
    # token issuer and signing keys, so this listener validates against those, not the management ones.
    oauth:
      validIssuerUri: https://development.kind.local
      # The cluster's public signing keys, written to OpenBao by local/kind/setup-secrets.sh and served
      # to the broker by the jwks-proxy.
      jwks:
        secretStore: openbao-local
        remoteKey: shared/pki/jwks
        remoteProperty: development
        secretName: kafka-external-oidc-jwks

  # Fixes the Accept header on requests to Kubernetes' /openid/v1/jwks (406 otherwise).
  # Not needed against public OIDC providers such as GKE.
  jwksProxy:
    enabled: true
    image: nginx:1.27-alpine

  # Authorization: deny-by-default ACLs. Each workload is identified by its principal
  # (= its ServiceAccount name, per the username claim above) and only gets what its
  # KafkaUser ACLs grant. Strimzi auto-manages ACLs for its own internal components.
  authorization:
    enabled: true
    superUsers: []

  # Topics created declaratively via the Topic Operator.
  topics:
    - name: pingkaf
      # split the topic into multiple partitions for parallelism
      partitions: 3
      # keep multiple copies of the topic across brokers for fault tolerance
      replicas: 3

  # Users (ACLs) managed by the User Operator. The user name is the Kafka principal and
  # must match the workload's ServiceAccount name.
  users:
    - name: pingkaf
      acls:
        # Produce to and consume from the pingkaf topic.
        - resourceType: topic
          name: pingkaf
          patternType: literal
          operations: [Read, Write, Describe, Create]
        # Join the pingkaf consumer group.
        - resourceType: group
          name: pingkaf
          patternType: literal
          operations: [Read]

  config:
    # How many copies of the internal consumer-offsets topic are kept across brokers.
    offsets.topic.replication.factor: 3
    # How many copies of the internal transaction-state topic are kept across brokers.
    transaction.state.log.replication.factor: 3
    # Minimum in-sync copies required to write to the transaction-state topic.
    transaction.state.log.min.isr: 2
    # Default number of copies for new topics when the client doesn't specify one.
    default.replication.factor: 3
    # Minimum in-sync copies a producer needs before a write is acknowledged.
    min.insync.replicas: 2
