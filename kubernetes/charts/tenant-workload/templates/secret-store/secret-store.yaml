# Per-tenant SecretStore used by ExternalSecrets in the tenant namespace.
#
# On local/kind: provider is OpenBao JWT (vault.enabled=true). Data lives in the
# shared per-cluster KV v2 mount `kv-development` at the ROOT namespace; each
# tenant is confined to its own path prefix kv-development/data/<tenant>/* by the
# identity-templated tenant-policy. ESO authenticates against the shared
# jwt-development-tenants backend using the shared `tenant` role; the resulting
# token self-scopes to this tenant's prefix via its verified alias name. Tenant
# ExternalSecrets therefore address secrets with remoteRef.key `<tenant>/<name>`.
# On GCP: vault.enabled=false and secretStore.provider is set in values-gcp.yaml
# (gcpsm + Workload Identity), rendered as-is via toYaml.

{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1" }}

{{- $tenant := .Values.tenant }}

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ $tenant.name | lower }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    {{- if .Values.vault.enabled }}
    vault:
      server: "https://openbao.mgmt.rezakara.demo"
      # Shared per-cluster KV v2 mount at the ROOT namespace; the token is
      # path-scoped to kv-development/data/<tenant>/* by tenant-policy.
      path: {{ .Values.vault.kvMount | quote }}
      version: "v2"
      caProvider:
        type: Secret
        name: root-ca
        key: tls.crt
      auth:
        jwt:
          path: "jwt-development-tenants"
          # Shared, identity-templated role; the token self-scopes per tenant.
          role: {{ .Values.vault.role | quote }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: "tenant-eso"
              namespace: {{ $tenant.name | lower }}
            audiences:
              - https://kubernetes.default.svc.cluster.local
    {{- else }}
    gcpsm:
      projectID: {{ include "tn.projectId" (dict "name" $tenant.tenantShortName "prefix" .Values.environmentPrefix) }}
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: "tenant-eso"
            namespace: {{ $tenant.name | lower }}
    {{- end }}

---
{{- end }}
