# ServiceAccount used by the tenant to authenticate to the management OpenBao
# (via the jwt-development-tenants backend, using the shared `tenant` role). Its
# projected, audience-bound token is the identity OpenBao binds an entity alias
# to. The alias resolves to this namespace name, so the identity-templated
# tenant-policy scopes access to kv-development/data/<tenant>/* only.

{{- if .Values.vault.enabled }}
{{- $tenant := .Values.tenant }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.serviceAccountName }}
  namespace: {{ $tenant.name | lower }}
  labels:
    {{- include "tn.labels" . | nindent 4 }}
    platform.rezakara.demo/tenant: {{ $tenant.name | lower }}
  annotations:
    argo.argoproj.io/sync-wave: "-10"

---
{{- end }}
