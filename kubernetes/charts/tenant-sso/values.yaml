# Set by the tenant Application (see the xtenant composition); not meant to be edited here.
tenant:
  name: ""

# provider-azuread ClusterProviderConfig that every resource references.
providerConfigRef:
  name: azuread
  kind: ClusterProviderConfig

# One Group + AppRole + RoleAssignment is created per entry.
# The app registrations and enterprise apps are created by OpenTofu in the bootstrap phase (azure/entraid-apps.tf).
apps:
  argocd:
    displayName: ArgoCD
    appRegObjectID: 805df85c-99e7-4e82-979f-242334735f59 # The ObjectID of the App Registration
    enterpriseAppObjectID: 622026ce-04e7-4b50-be99-f4302860da61 # The ObjectID of the Enterprise App

  vault:
    displayName: Vault
    appRegObjectID: ae09d0bb-9255-48f7-8237-0ecf24228334 # The ObjectID of the App Registration
    enterpriseAppObjectID: 90335c29-5e38-4f3f-9f44-cfa9cb88cf1e # The ObjectID of the Enterprise App
