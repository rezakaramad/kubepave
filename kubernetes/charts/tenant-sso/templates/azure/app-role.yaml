{{- $tenant := include "tenant-sso.tenant" . }}
{{- range $key, $app := .Values.apps }}

apiVersion: applications.azuread.m.upbound.io/v1beta1
kind: AppRole
metadata:
  name: {{ printf "app-role-%s-%s" $key $tenant }}
  namespace: {{ $.Release.Namespace }}
  labels:
    platform.rezakara.demo/tenant: {{ $tenant | quote }}
spec:
  providerConfigRef:
    name: {{ $.Values.providerConfigRef.name }}
    kind: {{ $.Values.providerConfigRef.kind }}
  forProvider:
    allowedMemberTypes:
      - User
    applicationId: {{ printf "/applications/%s" $app.appRegObjectID | quote }}
    displayName: {{ $tenant | quote }}
    description: {{ printf "%s Access for %s" $app.displayName $tenant | quote }}
    # The value Entra puts in the `roles` claim of a token, the tenant name.
    value: {{ $tenant | quote }}
    roleId: {{ include "tenant-sso.roleId" (dict "key" $key "tenant" $tenant) | quote }}

---
{{- end }}
