apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    external-dns-create: "true"
  name: openbao
  namespace: openbao
spec:
  hostnames:
  - openbao.mgmt.rezakara.demo
  - openbao.default.svc.cluster.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: default-traefik
    namespace: platform-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: openbao
      port: 8200
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
