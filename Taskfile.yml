version: '3'
runner: bash

tasks:
  minikube:check:
    desc: "Verify required dependencies are installed"
    cmds:
      - ./local/minikube/check-dependencies.sh
  minikube:start:
    desc: "Start Minikube clusters"
    deps: [minikube:check]
    cmds:
      - ./local/minikube/setup-minikube.sh start
      - ./local/minikube/setup-iptables.sh
  minikube:up:
    desc: "Run kubepave on Minikube"
    deps: [minikube:start]
    silent: true
    cmds:
      - |
        start=$(date +%s)

        ./local/minikube/install-charts.sh
        ./local/minikube/setup-secrets.sh
        ./local/minikube/setup-trust.sh
        ./local/minikube/setup-vault.sh
        ./local/minikube/setup-dns.sh start
        ./local/minikube/setup-dns.sh clean_etc_hosts
        ./local/minikube/setup-kubectl.sh

        end=$(date +%s)

        echo ""
        echo "⏱️  Total time: $((end - start)) seconds"
  minikube:tunnels:
    desc: "List Minikube tunnels"
    cmds:
      - ./local/minikube/setup-minikube.sh tunnels
  minikube:down:
    desc: "Tear down everything"
    cmds:
      - ./local/minikube/setup-minikube.sh destroy
      - ./local/minikube/setup-dns.sh reset
  kind:check:
    desc: "Verify required dependencies are installed"
    cmds:
      - ./local/kind/check-dependencies.sh
  kind:up:
    desc: "Bootstrap the full kind-based local environment"
    deps: [kind:check]
    silent: true
    cmds:
      - |
        set -euo pipefail
        cd local/kind

        start=$(date +%s)

        bash setup-clusters.sh start
        bash setup-cilium.sh install
        bash install-gateway-api.sh
        bash setup-dns.sh start
        bash install-charts.sh
        bash setup-openbao.sh
        bash setup-secrets.sh
        bash setup-trust.sh

        end=$(date +%s)
        echo ""
        echo "⏱️  Total time: $((end - start)) seconds"

        accessor=$(grep '^export OPENBAO_OIDC_ACCESSOR=' ../../.platform.env 2>/dev/null | cut -d'"' -f2 || true)
        current=$(grep -E '^\s+oidcAccessor:' ../../kubernetes/charts/crossplane/values-local-management.yaml | cut -d'"' -f2 || true)
        echo ""
        if [ "$accessor" != "$current" ]; then
          echo "⚠️  ACTION REQUIRED: the OpenBao OIDC accessor changed."
          echo "   New:     ${accessor:-<not found in .platform.env>}"
          echo "   In Git:  ${current:-<empty>}"
          echo "   Set vaultProvider.oidcAccessor in kubernetes/charts/crossplane/values-local-management.yaml,"
          echo "   commit, push and sync crossplane-management."
        else
          echo "✅ OIDC accessor in kubernetes/charts/crossplane/values-local-management.yaml is up to date ($accessor)"
        fi
  kind:down:
    desc: "Tear down the kind clusters and reset local DNS"
    cmds:
      - cd local/kind && bash setup-clusters.sh destroy
      - cd local/kind && bash setup-dns.sh reset
  azure:local:up:
    desc: "Bootstrap Azure Entra ID for kubepave"
    cmds:
      - ./azure/local/tofu-apply.sh src/bootstrap/azure

  azure:local:down:
    desc: "Tear down Azure Entra ID"
    cmds:
      - ./azure/local/tofu-destroy.sh src/bootstrap/azure

  azure:local:verify:
    desc: "Verify Azure Entra ID setup"
    cmds:
      - ./azure/local/verify-entraid.sh "Argo CD"
